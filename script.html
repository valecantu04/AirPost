<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- UTILITY: Wrap google.script.run in a Promise ---
    const runGas = (functionName, ...args) => {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [functionName](...args);
        });
    };

    const AirPostApp = () => {
        // --- GLOBAL STATE ---
        const [step, setStep] = useState(1);
        const [isInitializing, setIsInitializing] = useState(true);
        const [globalData, setGlobalData] = useState({ userEmail: '', totalSent: 0 });
        const [toasts, setToasts] = useState([]);

        // Form State
        const [aliases, setAliases] = useState([]);
        const [templates, setTemplates] = useState([]);
        const [selectedAlias, setSelectedAlias] = useState('');
        const [selectedTemplate, setSelectedTemplate] = useState('');
        
        // Audience State
        const [sheetUrl, setSheetUrl] = useState('');
        const [sheetTabs, setSheetTabs] = useState([]);
        const [selectedTab, setSelectedTab] = useState('');
        const [validationState, setValidationState] = useState({ status: 'idle', details: null });
        const [isValidating, setIsValidating] = useState(false);

        // Preview & Send State
        const [subjectLine, setSubjectLine] = useState('');
        const [previewHtml, setPreviewHtml] = useState(null);
        const [isSending, setIsSending] = useState(false);
        const [sendResults, setSendResults] = useState(null);

        // --- INITIALIZATION ---
        useEffect(() => {
            const initApp = async () => {
                try {
                    const [email, totalCount, aliasesData, templatesData] = await Promise.all([
                        runGas('getUserEmail'),
                        runGas('getTotalSentEmailCount'),
                        runGas('getSendAsAliases'),
                        runGas('getTemplates')
                    ]);
                    
                    setGlobalData({ userEmail: email, totalSent: totalCount });
                    setAliases(aliasesData || []);
                    setTemplates(templatesData || []);
                    
                    if (aliasesData && aliasesData.length > 0) {
                        setSelectedAlias(aliasesData[0].email);
                    }
                } catch (error) {
                    addToast('Failed to load application data', 'error');
                } finally {
                    setIsInitializing(false);
                }
            };
            initApp();
        }, []);

        // --- TOAST SYSTEM ---
        const addToast = (message, type = 'success') => {
            const id = Date.now();
            setToasts(prev => [...prev, { id, message, type }]);
            setTimeout(() => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, 4000);
        };

        // --- STEP 1 LOGIC ---
        const handleStep1Next = () => {
            if (!selectedAlias || !selectedTemplate) {
                addToast('Please select a sender and template.', 'error');
                return;
            }
            setStep(2);
        };

        // --- STEP 2 LOGIC ---
        const handleExtractTabs = async () => {
            if (!sheetUrl) return;
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) {
                addToast('Invalid Google Sheet URL', 'error');
                return;
            }
            try {
                const tabs = await runGas('getSheetTabs', sheetIdMatch[0]);
                setSheetTabs(tabs);
                if (tabs.length > 0) setSelectedTab(tabs[0]);
            } catch (err) {
                addToast('Failed to load tabs. Ensure you have access to the Sheet.', 'error');
            }
        };

        // Auto-fetch tabs when URL changes
        useEffect(() => {
            setValidationState({ status: 'idle', details: null }); // Reset validation on input change
            const delayDebounceFn = setTimeout(() => {
                handleExtractTabs();
            }, 1000);
            return () => clearTimeout(delayDebounceFn);
        }, [sheetUrl]);

        const handleValidateSheet = async () => {
            if (!sheetUrl || !selectedTab) return addToast('URL and Tab required.', 'error');
            
            setIsValidating(true);
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const result = await runGas('validateSheetColumns', sheetId, selectedTemplate, selectedTab);
                
                setValidationState({ 
                    status: result.valid ? 'success' : 'error', 
                    details: result 
                });

                if (result.valid) addToast('Sheet validated successfully!', 'success');
                else addToast('Missing required columns in sheet.', 'error');
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsValidating(false);
            }
        };

        // --- STEP 3 LOGIC ---
        const handleGeneratePreview = async () => {
            if (!subjectLine) {
                addToast('Please enter a subject line.', 'error');
                return;
            }
            setPreviewHtml('<div class="flex items-center justify-center p-8"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-slate-400"></i></div>');
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const html = await runGas('generateEmailPreview', sheetId, selectedTemplate, selectedTab);
                setPreviewHtml(html);
            } catch (err) {
                setPreviewHtml('<div class="text-red-500 p-4">Error generating preview.</div>');
                addToast('Failed to generate preview', 'error');
            }
        };

        const handleSendEmails = async () => {
            if (!subjectLine) return addToast('Subject is required.', 'error');
            
            if (!confirm("Are you sure you want to send emails? This cannot be undone.")) return;

            setIsSending(true);
            setSendResults(null);
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const selectedAliasObj = aliases.find(a => a.email === selectedAlias);
                
                const res = await runGas('sendEmailsWithSheet', sheetId, selectedTemplate, subjectLine, selectedTab, selectedAlias, selectedAliasObj.displayName);
                
                if (res.success) {
                    setSendResults(res.details); // Store the payload
                    
                    // Dynamic toast messaging based on results
                    if (res.details.failed && res.details.failed.length > 0) {
                        addToast(`Sent ${res.details.sent}, but ${res.details.failed.length} failed.`, 'error');
                    } else if (res.details.sent > 0) {
                        addToast(`Successfully sent ${res.details.sent} emails!`, 'success');
                    } else if (res.details.skipped > 0) {
                        addToast(`0 sent. ${res.details.skipped} skipped (already processed).`, 'success');
                    } else {
                        addToast(`0 emails sent. No valid emails found in sheet.`, 'error');
                    }
                    
                    runGas('getTotalSentEmailCount').then(count => setGlobalData(prev => ({...prev, totalSent: count})));
                } else {
                    addToast('Failed to execute send operation.', 'error');
                }
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsSending(false);
            }
        };

        // --- RENDER HELPERS ---
        if (isInitializing) return (
            <div className="flex h-screen w-screen items-center justify-center bg-[#05161F]">
                <div className="flex flex-col items-center gap-4">
                    <i className="fa-solid fa-paper-plane text-4xl text-[#22d3ee] animate-pulse"></i>
                    <p className="text-white text-lg font-medium">Loading AirPost Environment...</p>
                </div>
            </div>
        );

        const getTemplateName = () => templates.find(t => t.id === selectedTemplate)?.name || 'Pending...';

        return (
            <div className="flex flex-col h-screen">
                {/* HEADER */}
                <header className="border-b border-[var(--border-moderate)] py-3 px-6 mb-4 flex justify-between items-center bg-[var(--surface-primary)]/40 backdrop-blur-md sticky top-0 z-50 shrink-0">
                    <div className="flex flex-col">
                        <h1 className="font-bold text-2xl tracking-tight text-white m-0 flex items-center gap-2">
                            <i className="fa-solid fa-paper-plane text-[var(--brand-primary)]"></i> AirPost
                        </h1>
                        <p className="text-sm text-[var(--text-secondary)] m-0 mt-1">Enterprise bulk email merging</p>
                    </div>
                    <div className="flex items-center gap-6">
                        <div className="flex items-center gap-2 text-[var(--text-secondary)] text-sm">
                            <i className="fa-solid fa-envelope-circle-check text-[var(--brand-primary)]"></i>
                            Total Emails Sent by Rubrikans: <span className="text-white font-bold">{globalData.totalSent.toLocaleString()}</span>
                        </div>
                        <div className="flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-full border border-[var(--border-moderate)] text-sm">
                            <i className="fa-solid fa-user-circle text-[var(--text-secondary)]"></i>
                            <span>{globalData.userEmail}</span>
                        </div>
                    </div>
                </header>

                <main className="flex-grow flex flex-col items-center p-4 min-h-0">
                    
                    {/* STEPPER */}
                    <div className="w-full max-w-5xl mb-6 px-4 shrink-0">
                        <div className="flex items-center justify-between relative">
                            <div className="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-[var(--border-moderate)] z-0 rounded"></div>
                            <div className="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-[var(--brand-primary)] z-0 rounded transition-all duration-500 shadow-[0_0_10px_var(--brand-primary)]" 
                                 style={{ width: step === 1 ? '0%' : step === 2 ? '50%' : '100%' }}></div>
                            
                            {[1, 2, 3].map(num => (
                                <div key={num} className="relative z-10 flex flex-col items-center">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold transition-colors ${step >= num ? 'text-[#020f24] bg-[var(--brand-primary)] shadow-[0_0_15px_rgba(34,211,238,0.5)] border-2 border-[var(--surface-primary)]' : 'text-[var(--text-secondary)] bg-[var(--surface-primary)] border-2 border-[var(--border-moderate)]'}`}>
                                        {step > num ? <i className="fa-solid fa-check"></i> : num}
                                    </div>
                                    <span className={`mt-2 font-semibold text-sm ${step >= num ? 'text-white' : 'text-[var(--text-disabled)]'}`}>
                                        {num === 1 ? 'Setup' : num === 2 ? 'Audience' : 'Preview & Send'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* WIZARD LAYOUT */}
                    <div className="w-full max-w-5xl wizard-layout flex flex-col md:flex-row overflow-hidden flex-grow">
                        
                        {/* LEFT COLUMN: Main Forms */}
                        <div className="flex-grow p-8 flex flex-col overflow-y-auto custom-scrollbar relative">
                            
                            {/* STEP 1: SETUP */}
                            {step === 1 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-6 border-b border-[var(--border-moderate)] pb-4 shrink-0">
                                        <h2 className="text-2xl font-bold flex items-center gap-2">
                                            <i className="fa-solid fa-sliders text-[var(--brand-primary)]"></i> Campaign Setup
                                        </h2>
                                        <p className="text-[var(--text-secondary)] mt-1 text-sm">Configure your sender details and select your email template.</p>
                                    </div>
                                    <div className="space-y-6 flex-grow overflow-y-auto custom-scrollbar pr-2">
                                        <div className="app-card">
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2">Send emails on behalf of:</label>
                                            <select className="form-input" value={selectedAlias} onChange={e => setSelectedAlias(e.target.value)}>
                                                <option value="" disabled>Select an address...</option>
                                                {aliases.map(a => <option key={a.email} value={a.email}>{a.displayName} ({a.email})</option>)}
                                            </select>
                                        </div>
                                        <div className="app-card">
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2">Email Template:</label>
                                            <select className="form-input" value={selectedTemplate} onChange={e => setSelectedTemplate(e.target.value)}>
                                                <option value="" disabled>-- Select a Google Doc Template --</option>
                                                {templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-[var(--border-moderate)] flex justify-end shrink-0">
                                        <button onClick={handleStep1Next} className="btn btn-primary">
                                            Next: Audience <i className="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2: AUDIENCE */}
                            {step === 2 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-6 border-b border-[var(--border-moderate)] pb-4 shrink-0">
                                        <h2 className="text-2xl font-bold flex items-center gap-2">
                                            <i className="fa-solid fa-users-viewfinder text-[var(--brand-primary)]"></i> Select Audience
                                        </h2>
                                        <p className="text-[var(--text-secondary)] mt-1 text-sm">Connect your Google Sheet and validate the required merge fields.</p>
                                    </div>
                                    <div className="space-y-6 flex-grow overflow-y-auto custom-scrollbar pr-2">
                                        <div className="app-card">
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2">Google Sheet URL</label>
                                            <input type="text" placeholder="https://docs.google.com/spreadsheets/d/..." className="form-input mb-4" value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} />
                                            
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2">Select Tab</label>
                                            <select className="form-input mb-4" disabled={sheetTabs.length === 0} value={selectedTab} onChange={e => setSelectedTab(e.target.value)}>
                                                {sheetTabs.length === 0 ? <option>Enter URL to load tabs...</option> : sheetTabs.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>

                                            <button onClick={handleValidateSheet} disabled={!sheetUrl || !selectedTab || isValidating} className="btn btn-secondary w-full">
                                                {isValidating ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Validating...</> : <><i className="fa-solid fa-bolt"></i> Validate Columns</>}
                                            </button>
                                        </div>

                                        {validationState.status !== 'idle' && (
                                            <div className="bg-black/20 rounded-lg border border-[var(--border-weak)] overflow-hidden">
                                                <div className="bg-[var(--surface-primary)] p-3 border-b border-[var(--border-moderate)] font-semibold text-sm flex justify-between items-center">
                                                    <span className="text-[var(--text-secondary)]">Validation Results</span>
                                                    {validationState.status === 'success' 
                                                        ? <span className="text-xs px-2 py-1 rounded-full bg-[var(--status-success)]/20 border border-[var(--status-success)]/50 text-[var(--status-success)] font-bold"><i className="fa-solid fa-check"></i> Valid</span>
                                                        : <span className="text-xs px-2 py-1 rounded-full bg-[var(--status-critical)]/20 border border-[var(--status-critical)]/50 text-[var(--status-critical)] font-bold"><i className="fa-solid fa-xmark"></i> Missing Fields</span>
                                                    }
                                                </div>
                                                <div className="p-4">
                                                    {validationState.status === 'error' && (
                                                        <p className="text-sm text-[var(--status-critical)] mb-2">Missing from Sheet: {validationState.details.missingKeywords.join(', ')}</p>
                                                    )}
                                                    <div className="flex gap-2 flex-wrap">
                                                        {validationState.details?.templateHeaders?.map(h => (
                                                            <span key={h} className={`px-2 py-1 rounded text-xs font-mono border ${validationState.details.missingKeywords.includes(h) ? 'bg-[var(--status-critical)]/10 border-[var(--status-critical)]/30 text-[var(--status-critical)]' : 'bg-[var(--status-success)]/10 border-[var(--status-success)]/30 text-[var(--status-success)]'}`}>
                                                                {h}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-[var(--border-moderate)] flex justify-between items-center shrink-0">
                                        <button onClick={() => setStep(1)} className="btn btn-secondary border-transparent"><i className="fa-solid fa-arrow-left"></i> Back</button>
                                        <button onClick={() => setStep(3)} disabled={validationState.status !== 'success'} className="btn btn-primary">Next: Preview <i className="fa-solid fa-arrow-right"></i></button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 3: PREVIEW & SEND */}
                            {step === 3 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-4 border-b border-[var(--border-moderate)] pb-4 flex justify-between items-end shrink-0">
                                        <div>
                                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                                <i className="fa-solid fa-envelope-open-text text-[var(--brand-primary)]"></i> Final Review
                                            </h2>
                                        </div>
                                        <button onClick={handleSendEmails} disabled={isSending || !subjectLine} className="btn btn-primary !py-3 !px-6 !text-sm shadow-[0_0_15px_rgba(34,211,238,0.3)]">
                                            {isSending ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Sending...</> : <><i className="fa-solid fa-paper-plane"></i> Dispatch Emails</>}
                                        </button>
                                    </div>

                                    <div className="flex-grow flex flex-col min-h-0">
                                        <div className="mb-4 flex gap-2">
                                            <input type="text" placeholder="Email Subject Line (e.g. Hi {{Name}}!)" className="form-input flex-grow" value={subjectLine} onChange={e => setSubjectLine(e.target.value)} />
                                            <button onClick={handleGeneratePreview} className="btn btn-secondary whitespace-nowrap"><i className="fa-solid fa-eye"></i> Gen Preview</button>
                                        </div>

                                        {/* DELIVERY REPORT UI */}
                                        {sendResults && (
                                            <div className={`mb-4 p-4 rounded-lg border shadow-inner ${sendResults.failed.length > 0 ? 'bg-[var(--status-critical)]/10 border-[var(--status-critical)]/30' : 'bg-[var(--status-success)]/10 border-[var(--status-success)]/30'}`}>
                                                <h4 className="font-bold mb-3 flex items-center gap-2 text-sm uppercase tracking-wide text-white">
                                                    <i className="fa-solid fa-chart-pie"></i> Delivery Report
                                                </h4>
                                                <div className="flex gap-6 text-sm mb-1 font-medium">
                                                    <span className="text-[var(--status-success)]"><i className="fa-solid fa-paper-plane mr-1"></i> Sent: <strong>{sendResults.sent}</strong></span>
                                                    <span className="text-[var(--text-secondary)]"><i className="fa-solid fa-forward-step mr-1"></i> Skipped: <strong>{sendResults.skipped}</strong></span>
                                                    <span className={sendResults.failed.length > 0 ? 'text-[var(--status-critical)]' : 'text-[var(--text-secondary)]'}><i className="fa-solid fa-triangle-exclamation mr-1"></i> Failed: <strong>{sendResults.failed.length}</strong></span>
                                                </div>
                                                
                                                {/* Explain the skipped emails behavior contextually */}
                                                {sendResults.skipped > 0 && sendResults.sent === 0 && (
                                                    <p className="text-xs text-[var(--text-secondary)] mt-2 italic bg-black/20 p-2 rounded">
                                                        * To re-send to skipped contacts, clear the contents of the "Timestamp" column in your Google Sheet.
                                                    </p>
                                                )}

                                                {/* Map out specific failures if they exist */}
                                                {sendResults.failed.length > 0 && (
                                                    <div className="mt-3 max-h-32 overflow-y-auto custom-scrollbar bg-black/40 p-3 rounded text-xs text-[var(--status-critical)] border border-[var(--status-critical)]/20">
                                                        <ul className="list-disc pl-4 space-y-1">
                                                            {sendResults.failed.map((f, i) => (
                                                                <li key={i}><strong>{f.email || 'Unknown'}</strong>: {f.error}</li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="flex-grow flex flex-col bg-white rounded-lg overflow-hidden border border-[var(--border-moderate)] text-slate-800 min-h-0">
                                            <div className="bg-slate-100 border-b border-slate-200 p-2 px-4 flex justify-between items-center text-xs text-slate-500 shrink-0">
                                                <span>Recipient Preview (Row 1)</span>
                                            </div>
                                            <div className="bg-slate-50 border-b border-slate-200 p-4 text-sm shrink-0">
                                                <div className="flex mb-1"><span className="w-16 text-slate-500">From:</span> <span className="font-semibold">{selectedAlias}</span></div>
                                                <div className="flex"><span className="w-16 text-slate-500">Subject:</span> <span className="font-bold">{subjectLine || <span className="text-slate-400 italic">No subject</span>}</span></div>
                                            </div>
                                            <div className="p-6 overflow-y-auto custom-scrollbar flex-grow bg-white text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: previewHtml || '<p class="text-slate-400 italic text-center mt-10">Click "Gen Preview" to render template.</p>' }}>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-[var(--border-moderate)] flex justify-start shrink-0">
                                        <button onClick={() => setStep(2)} className="btn btn-secondary border-transparent"><i className="fa-solid fa-arrow-left"></i> Back</button>
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* RIGHT COLUMN: Summary Sidebar */}
                        <div className="w-full md:w-80 bg-black/20 border-l border-[var(--border-moderate)] p-6 flex flex-col shadow-inner shrink-0">
                            <h3 className="text-sm font-bold text-[var(--text-secondary)] uppercase tracking-[0.05em] mb-6 flex items-center gap-2">
                                <i className="fa-solid fa-list-check"></i> Summary
                            </h3>

                            <div className="flex flex-col flex-grow">
                                <div className="summary-item">
                                    <span className="summary-label">Sender</span>
                                    {selectedAlias ? <div className="summary-value"><i className="fa-solid fa-circle-check text-[var(--brand-primary)]"></i> <span className="truncate">{selectedAlias}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Template</span>
                                    {selectedTemplate ? <div className="summary-value"><i className="fa-solid fa-file-lines text-[var(--brand-primary)]"></i> <span className="truncate">{getTemplateName()}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Audience Data</span>
                                    {validationState.status === 'success' ? <div className="summary-value"><i className="fa-solid fa-table text-[var(--status-success)]"></i> <span className="text-[var(--status-success)]">Sheet Validated</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Subject Line</span>
                                    {subjectLine ? <div className="summary-value"><i className="fa-solid fa-pen text-[var(--brand-primary)]"></i> <span className="truncate">{subjectLine}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                            </div>
                        </div>

                    </div>
                </main>

                {/* TOAST SYSTEM RENDERING */}
                <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none">
                    {toasts.map(toast => (
                        <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-2xl border-l-4 ${toast.type === 'success' ? 'border-[var(--status-success)]' : 'border-[var(--status-critical)]'} bg-[var(--surface-primary)] text-white min-w-[300px] border border-[var(--border-moderate)]`}>
                            <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-[var(--status-success)]' : 'fa-triangle-exclamation text-[var(--status-critical)]'} text-xl`}></i>
                            <div className="flex flex-col">
                                <span className="font-bold text-sm tracking-wide uppercase">{toast.type === 'success' ? 'Success' : 'Notice'}</span>
                                <span className="text-xs text-[var(--text-secondary)] mt-0.5">{toast.message}</span>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AirPostApp />);
</script>

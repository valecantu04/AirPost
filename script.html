<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- UTILITY: Wrap google.script.run in a Promise ---
    const runGas = (functionName, ...args) => {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [functionName](...args);
        });
    };

    const Stepper = ({ steps, currentStep, onStepClick }) => {
        // Mathematically calculate progress width based on dynamic step array
        const totalSteps = steps.length;
        const progressWidth = ((currentStep - 1) / (totalSteps - 1)) * 100;

        return (
            <div className="w-full relative pt-2 pb-8 mb-4">
                
                {/* --- TRACK CONTAINER --- */}
                {/* left-[1.25rem] and right-[1.25rem] perfectly align the track to the center of the w-10 (2.5rem) circular nodes */}
                <div className="absolute top-[1.4rem] left-[1.25rem] right-[1.25rem] h-1 z-0">
                    {/* Inactive Background Track */}
                    <div className="absolute inset-0 w-full h-full bg-[var(--border-moderate)] rounded"></div>
                    {/* Active Progress Track */}
                    <div 
                        className="absolute top-0 left-0 h-full bg-[var(--brand-primary)] rounded transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] shadow-[0_0_10px_var(--brand-primary)]"
                        style={{ width: `${progressWidth}%` }}
                    ></div>
                </div>

                {/* --- STEP NODES --- */}
                <div className="relative z-10 flex justify-between">
                    {steps.map((step, index) => {
                        const stepNum = index + 1;
                        const isCompleted = currentStep > stepNum;
                        const isActive = currentStep === stepNum;
                        
                        // Determine styles based on state
                        let nodeClasses = "w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 ease-in-out border-2 ";
                        let textClasses = "absolute top-12 text-center w-28 text-sm font-semibold transition-colors duration-300 ";

                        if (isCompleted) {
                            // Completed State
                            nodeClasses += "bg-[var(--brand-primary)] border-[var(--surface-primary)] text-[#020f24] cursor-pointer hover:scale-105 hover:shadow-[0_0_15px_rgba(34,211,238,0.5)]";
                            textClasses += "text-white cursor-pointer";
                        } else if (isActive) {
                            // Active State
                            nodeClasses += "bg-[var(--brand-primary)] border-[var(--surface-primary)] text-[#020f24] shadow-[0_0_15px_rgba(34,211,238,0.6)] scale-105";
                            textClasses += "text-white";
                        } else {
                            // Upcoming State
                            nodeClasses += "bg-[var(--surface-primary)] border-[var(--border-moderate)] text-[var(--text-secondary)]";
                            textClasses += "text-[var(--text-disabled)]";
                        }

                        return (
                            <div key={step.id} className="flex flex-col items-center relative">
                                <button 
                                    onClick={() => isCompleted && onStepClick(stepNum)}
                                    disabled={!isCompleted}
                                    className={nodeClasses}
                                    aria-label={`Step ${stepNum}: ${step.label}`}
                                    aria-current={isActive ? "step" : undefined}
                                >
                                    {isCompleted ? <i className="fa-solid fa-check"></i> : stepNum}
                                </button>
                                <span 
                                    className={textClasses}
                                    onClick={() => isCompleted && onStepClick(stepNum)}
                                >
                                    {step.label}
                                </span>
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    };

    const AirPostApp = () => {
        // --- GLOBAL STATE ---
        const [step, setStep] = useState(1);
        const [isInitializing, setIsInitializing] = useState(true);
        const [globalData, setGlobalData] = useState({ userEmail: '', totalSent: 0 });
        const [toasts, setToasts] = useState([]);
        
        const WORKFLOW_STEPS = [
        { id: 'setup', label: 'Campaign Setup' },
        { id: 'audience', label: 'Audience' },
        { id: 'preview', label: 'Preview & Send' }
        
        ];
        // Get logo from window
        const logoSvg = window.LOGO_SVG || '';

        // Form State
        const [aliases, setAliases] = useState([]);
        const [templates, setTemplates] = useState([]);
        const [selectedAlias, setSelectedAlias] = useState('');
        const [selectedTemplate, setSelectedTemplate] = useState('');
        const [showFolderSettings, setShowFolderSettings] = useState(false);
        const [folderName, setFolderName] = useState('');
        const [currentFolderId, setCurrentFolderId] = useState('');
        const [folderIdInput, setFolderIdInput] = useState('');
        
        // Audience State
        const [sheetUrl, setSheetUrl] = useState('');
        const [sheetTabs, setSheetTabs] = useState([]);
        const [selectedTab, setSelectedTab] = useState('');
        const [validationState, setValidationState] = useState({ status: 'idle', details: null });
        const [isValidating, setIsValidating] = useState(false);
        const [isFetchingTabs, setIsFetchingTabs] = useState(false);
        const [isGeneratingSheet, setIsGeneratingSheet] = useState(false);

        // Preview & Send State
        const [subjectLine, setSubjectLine] = useState('');
        const [previewData, setPreviewData] = useState(null);
        const [previewIndex, setPreviewIndex] = useState(0);
        const [isFetchingPreview, setIsFetchingPreview] = useState(false);
        const [isSending, setIsSending] = useState(false);
        const [sendResults, setSendResults] = useState(null);

        // --- UI COMPONENT: Live Subject Highlighter ---
        const HighlightedSubject = ({ text }) => {
            if (!text) return <span className="text-slate-400 italic">(Enter subject above)</span>;
            
            // Split by {{Variable}} preserving the match
            const parts = text.split(/({{.*?}})/g);
            return (
                <span>
                    {parts.map((part, i) => {
                        if (part.startsWith('{{') && part.endsWith('}}')) {
                            // Render variables with a cyan pill highlight
                            return <span key={i} className="bg-cyan-100 text-cyan-800 px-1 rounded font-semibold">{part.replace(/[{}]/g, '')}</span>;
                        }
                        return <span key={i}>{part}</span>; // Render normal text
                    })}
                </span>
            );
        };

        // --- STEPPER NAVIGATION ---
        const handleStepperClick = (targetStep) => {
            // Users can only click backward to completed steps, preventing them from skipping validation
            if (targetStep < step) {
                setStep(targetStep);
            }
        };

        // --- INITIALIZATION ---
        useEffect(() => {
            const initApp = async () => {
                try {
                    const [email, totalCount, aliasesData, templatesData, fName, fId] = await Promise.all([
                        runGas('getUserEmail'),
                        runGas('getTotalSentEmailCount'),
                        runGas('getSendAsAliases'),
                        runGas('getTemplates'),
                        runGas('getTemplateFolderName'),
                        runGas('getTemplateFolderId')
                    ]);
                    
                    setGlobalData({ userEmail: email, totalSent: totalCount });
                    setAliases(aliasesData || []);
                    setTemplates(templatesData || []);
                    
                    // Set Folder Data
                    setFolderName(fName || 'Unknown Folder');
                    setCurrentFolderId(fId || '');
                    setFolderIdInput(fId || ''); // Pre-fill the input field

                    if (aliasesData && aliasesData.length > 0) {
                        setSelectedAlias(aliasesData[0].email);
                    }
                } catch (error) {
                    addToast('Failed to load application data', 'error');
                } finally {
                    setIsInitializing(false);
                }
            };
            initApp();
        }, []);

        // --- TOAST SYSTEM ---
        const addToast = (message, type = 'success') => {
            const id = Date.now();
            
            // 1. Add the toast with an isExiting flag set to false
            setToasts(prev => [...prev, { id, message, type, isExiting: false }]);
            
            // 2. Trigger the fade-out animation slightly before removal (at 3.6 seconds)
            setTimeout(() => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, isExiting: true } : t));
            }, 3600);

            // 3. Physically remove the element from the DOM (at 4 seconds)
            setTimeout(() => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, 4000);
        };

        // --- STEP 1 LOGIC ---
        const handleUpdateFolder = async () => {
            if (!folderIdInput) return;

            // If the user pasted a full URL, extract the ID. Otherwise, assume they pasted the raw ID.
            const idMatch = folderIdInput.match(/[-\w]{25,}/);
            const finalFolderId = idMatch ? idMatch[0] : folderIdInput.trim();
            try {
                await runGas('setTemplateFolderId', finalFolderId);
                addToast('Source folder updated!', 'success');
                
                // --- RE-FETCH DATA UPON SUCCESSFUL FOLDER CHANGE ---
                const [newTemplates, newFName, newFId] = await Promise.all([
                    runGas('getTemplates'),
                    runGas('getTemplateFolderName'),
                    runGas('getTemplateFolderId')
                ]);
                
                setTemplates(newTemplates || []);
                setFolderName(newFName || 'Unknown Folder');
                setCurrentFolderId(newFId || finalFolderId);
                setSelectedTemplate('');
                setShowFolderSettings(false);
            } catch (err) {
                addToast(err.message, 'error');
            }
        };

        const handleStep1Next = () => {
            if (!selectedAlias || !selectedTemplate) {
                addToast('Please select a sender and template.', 'error');
                return;
            }
            setStep(2);
        };

        // --- STEP 2 LOGIC ---
        const handleExtractTabs = async () => {
            if (!sheetUrl) return;
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) {
                addToast('Invalid Google Sheet URL', 'error');
                return;
            }
            setIsFetchingTabs(true);
            try {
                const tabs = await runGas('getSheetTabs', sheetIdMatch[0]);
                setSheetTabs(tabs);
                if (tabs.length > 0 && !tabs.includes(selectedTab)) {
                    setSelectedTab(tabs[0]);
                } else if (tabs.length === 0) {
                    setSelectedTab('');
                }
            } catch (err) {
                addToast('Failed to load tabs. Ensure you have access to the Sheet.', 'error');
            } finally {
                setIsFetchingTabs(false); // --- END LOADING ---
            }
        };

        // --- HANDLE SHEET GENERATION ---
        const handleGenerateSheet = async () => {
            setIsGeneratingSheet(true);
            try {
                // Call backend to create the sheet
                const url = await runGas('generateAudienceSheet', selectedTemplate, currentFolderId);
                
                // Automatically populate the input field with the new URL
                setSheetUrl(url);
                
                addToast('Sheet generated perfectly! Please open it to add your contacts.', 'success');
                
                // Pop open the new sheet in a new tab so the user can immediately add data
                window.open(url, '_blank');
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsGeneratingSheet(false);
            }
        };

        // 1. Handle URL Debouncing separately
        useEffect(() => {
            const delayDebounceFn = setTimeout(() => {
                if (sheetUrl) handleExtractTabs();
            }, 1000);
            return () => clearTimeout(delayDebounceFn);
        }, [sheetUrl]);

        // 2. CORNER CASE FIX: Centralized State Invalidator
        // If the Template, Sheet URL, or Tab changes, we MUST wipe all downstream progress.
        useEffect(() => {
            setValidationState({ status: 'idle', details: null });
            setPreviewData(null);
            setPreviewIndex(0);
            setSendResults(null);
        }, [sheetUrl, selectedTemplate, selectedTab]);

        const handleValidateSheet = async () => {
            if (!sheetUrl || !selectedTab) return addToast('URL and Tab required.', 'error');
            
            setIsValidating(true);
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const result = await runGas('validateSheetColumns', sheetId, selectedTemplate, selectedTab);
                
                setValidationState({ 
                    status: result.valid ? 'success' : 'error', 
                    details: result 
                });

                if (result.valid) addToast('Sheet validated successfully!', 'success');
                else addToast('Missing required columns in sheet.', 'error');
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsValidating(false);
            }
        };

        // --- STEP 3 LOGIC ---
        const fetchPreview = async (index) => {
            setIsFetchingPreview(true);
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const res = await runGas('generateEmailPreview', sheetId, selectedTemplate, selectedTab, index);
                setPreviewData(res);
                setPreviewIndex(index);
            } catch (err) {
                addToast('Failed to generate preview', 'error');
            } finally {
                setIsFetchingPreview(false);
            }
        };

        const handleGeneratePreview = () => {
            // CORNER CASE FIX: Prevent whitespace-only subjects
            if (!subjectLine.trim()) {
                addToast('Please enter a valid subject line.', 'error');
                return;
            }
            fetchPreview(0); 
        };

        const handleSendEmails = async () => {
            // CORNER CASE FIX: Prevent whitespace-only subjects
            if (!subjectLine.trim()) return addToast('Subject is required.', 'error');
            
            if (!confirm("Are you sure you want to send emails? This cannot be undone.")) return;

            setIsSending(true);
            setSendResults(null);
            try {
                const sheetId = sheetUrl.match(/[-\w]{25,}/)[0];
                const selectedAliasObj = aliases.find(a => a.email === selectedAlias);
                
                const res = await runGas('sendEmailsWithSheet', sheetId, selectedTemplate, subjectLine, selectedTab, selectedAlias, selectedAliasObj.displayName);
                
                if (res.success) {
                    setSendResults(res.details); // Store the payload
                    
                    // Dynamic toast messaging based on results
                    if (res.details.failed && res.details.failed.length > 0) {
                        addToast(`Sent ${res.details.sent}, but ${res.details.failed.length} failed.`, 'error');
                    } else if (res.details.sent > 0) {
                        addToast(`Successfully sent ${res.details.sent} emails!`, 'success');
                    } else if (res.details.skipped > 0) {
                        addToast(`0 sent. ${res.details.skipped} skipped (already processed).`, 'success');
                    } else {
                        addToast(`0 emails sent. No valid emails found in sheet.`, 'error');
                    }
                    
                    runGas('getTotalSentEmailCount').then(count => setGlobalData(prev => ({...prev, totalSent: count})));
                } else {
                    addToast('Failed to execute send operation.', 'error');
                }
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsSending(false);
            }
        };

        // --- RESET LOGIC ---
        const handleStartOver = () => {
            if (!confirm("Are you sure you want to start over? All current progress will be lost.")) return;
            
            // Reset to step 1
            setStep(1);
            
            // Reset Configuration
            if (aliases && aliases.length > 0) {
                setSelectedAlias(aliases[0].email);
            } else {
                setSelectedAlias('');
            }
            setSelectedTemplate('');
            
            // Reset Audience
            setSheetUrl('');
            setSheetTabs([]);
            setSelectedTab('');
            setValidationState({ status: 'idle', details: null });
            
            // Reset Preview & Send
            setSubjectLine('');
            setPreviewData(null);
            setPreviewIndex(0);
            setSendResults(null);
            
            addToast('Campaign reset successfully.', 'success');
        };

        const getTemplateName = () => templates.find(t => t.id === selectedTemplate)?.name || 'Pending...';

        return (
            <div className="flex flex-col h-screen">
                {/* HEADER */}
                <header className="border-b border-[var(--border-moderate)] py-3 px-6 mb-4 flex justify-between items-center bg-[var(--surface-primary)]/40 backdrop-blur-md sticky top-0 z-50 shrink-0">
                    <div className="flex flex-col">
                        <h1 className="font-bold text-2xl tracking-tight text-white m-0 flex items-center gap-2">
                            <i className="fa-solid fa-paper-plane text-[var(--brand-primary)]"></i> AirPost
                        </h1>
                        <p className="text-sm text-[var(--text-secondary)] m-0 mt-1">Enterprise bulk email merging</p>
                    </div>
                    <div className="flex items-center gap-6">
                        <div className="flex items-center gap-2 text-[var(--text-secondary)] text-sm">
                            <i className="fa-solid fa-envelope-circle-check text-[var(--brand-primary)]"></i>
                            Total Sent: 
                            {isInitializing ? (
                                <div className="h-5 w-12 bg-white/20 rounded animate-pulse"></div>
                            ) : (
                                <span className="text-white font-bold">{globalData.totalSent.toLocaleString()}</span>
                            )}
                        </div>
                        <div className="flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-full border border-[var(--border-moderate)] text-sm">
                            <i className="fa-solid fa-user-circle text-[var(--text-secondary)]"></i>
                            {isInitializing ? (
                                <div className="h-5 w-32 bg-white/20 rounded animate-pulse"></div>
                            ) : (
                                <span>{globalData.userEmail}</span>
                            )}
                        </div>
                        
                        {/* --- LOGO --- */}
                        <div className="header-logo-group">
                            <div style={{textAlign:'right', lineHeight: 1.2}}>
                                <div style={{fontSize:'0.75rem', color:'var(--text-disabled)', textTransform:'uppercase', letterSpacing:'0.05em'}}>Powered by</div>
                                <div style={{fontSize:'0.9rem', fontWeight:600, color:'var(--brand-primary)'}}>Red Panda Projects</div>
                            </div>
                            <div dangerouslySetInnerHTML={{ __html: logoSvg }} className="header-logo" style={{width:'36px', height:'36px', filter: 'drop-shadow(0 0 8px rgba(0, 136, 161, 0.4))'}} />
                        </div>
                    </div>
                </header>

                <main className="flex-grow flex flex-col items-center p-4 min-h-0">
                    
                    {/* STEPPER */}
                    <div className="w-full max-w-6xl px-8 shrink-0">
                        <Stepper 
                            steps={WORKFLOW_STEPS} 
                            currentStep={step} 
                            onStepClick={handleStepperClick} 
                        />
                    </div>

                    {/* WIZARD LAYOUT */}
                    <div className="w-full max-w-6xl wizard-layout flex flex-col md:flex-row overflow-hidden flex-grow">
                        
                        {/* --- NEW: LEFT COLUMN WRAPPER --- */}
                        {/* This handles fixed toast positioning and hides overflow so the toast appears to slide from under the sidebar */}
                        <div className="flex-grow flex flex-col relative overflow-hidden">
                            
                            {/* TOAST SYSTEM RENDERING */}
                            <div className="absolute top-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none">
                                {toasts.map(toast => (
                                    <div key={toast.id} className={`${toast.isExiting ? 'toast-exit' : 'toast-enter'} pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-2xl border-l-4 ${toast.type === 'success' ? 'border-[var(--status-success)]' : 'border-[var(--status-critical)]'} bg-[var(--surface-primary)] text-white min-w-[280px] max-w-[350px] border border-[var(--border-moderate)]`}>
                                        <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-[var(--status-success)]' : 'fa-triangle-exclamation text-[var(--status-critical)]'} text-xl`}></i>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm tracking-wide uppercase">{toast.type === 'success' ? 'Success' : 'Notice'}</span>
                                            <span className="text-xs text-[var(--text-secondary)] mt-0.5">{toast.message}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* LEFT COLUMN: Main Forms (Now scrollable inside the wrapper) */}
                            <div className="flex-grow p-8 flex flex-col overflow-y-auto custom-scrollbar relative">
                            
                            {/* STEP 1: SETUP */}
                            {step === 1 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-6 border-b border-[var(--border-moderate)] pb-4 shrink-0">
                                        <h2 className="text-2xl font-bold flex items-center gap-2">
                                            <i className="fa-solid fa-sliders text-[var(--brand-primary)]"></i> Campaign Setup
                                        </h2>
                                        <p className="text-[var(--text-secondary)] mt-1 text-sm">Configure your sender details and select your email template.</p>
                                    </div>
                                    <div className="space-y-6 flex-grow overflow-y-auto custom-scrollbar pr-2">
                                        <div className="app-card">
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2">Send emails on behalf of:</label>
                                            {/* SKELETON LOADER */}
                                            {isInitializing ? (
                                                <div className="h-[46px] w-full bg-[var(--input-background)] border border-[var(--input-border)] rounded animate-pulse"></div>
                                            ) : (
                                                <select className="form-input" value={selectedAlias} onChange={e => setSelectedAlias(e.target.value)}>
                                                    <option value="" disabled>Select an address...</option>
                                                    {aliases.map(a => <option key={a.email} value={a.email}>{a.displayName} ({a.email})</option>)}
                                                </select>
                                            )}
                                        </div>
                                        
                                        <div className="app-card">
                                            {/* --- UPDATED TEMPLATE HEADER WITH DRIVE PILL --- */}
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-1">Email Template</label>
                                                    
                                                    {/* Elegant Google Drive Pill */}
                                                    <div className="flex items-center gap-2 mt-1.5">
                                                        <span className="text-xs text-[var(--text-disabled)] uppercase tracking-wider font-semibold">Source</span>
                                                        <a href={`https://drive.google.com/drive/folders/${currentFolderId}`} target="_blank" rel="noreferrer" 
                                                           className="flex items-center gap-1.5 px-2.5 py-1 rounded bg-black/20 border border-[var(--border-weak)] text-[var(--brand-primary)] hover:bg-[var(--brand-primary)]/10 hover:border-[var(--brand-primary)] transition-all text-xs max-w-[200px]"
                                                           title="Open in Google Drive">
                                                            <i className="fa-solid fa-folder-open"></i> 
                                                            <span className="truncate font-medium">{folderName || 'Loading...'}</span>
                                                        </a>
                                                    </div>
                                                </div>
                                                
                                                {/* More subtle toggle button */}
                                                <button onClick={() => setShowFolderSettings(!showFolderSettings)} className="text-xs text-[var(--text-secondary)] hover:text-white transition-colors font-medium flex items-center gap-1.5 bg-transparent border border-[var(--border-moderate)] hover:border-[var(--brand-primary)] px-2 py-1 rounded">
                                                    <i className="fa-solid fa-pen-to-square"></i> Edit Source
                                                </button>
                                            </div>
                                            
                                            {showFolderSettings && (
                                                <div className="mb-4 p-4 bg-black/20 border border-[var(--border-weak)] rounded-lg animate-fade-in shadow-inner">
                                                    <label className="block text-xs font-semibold text-[var(--text-secondary)] mb-2">Google Drive Folder URL or ID:</label>
                                                    <div className="flex gap-2">
                                                        {/* UPDATED PLACEHOLDER TO REFLECT NEW CAPABILITY */}
                                                        <input type="text" placeholder="Paste Folder URL or ID here" className="form-input !py-2 text-sm flex-1 font-mono" value={folderIdInput} onChange={e => setFolderIdInput(e.target.value)} />
                                                        <button onClick={handleUpdateFolder} className="btn btn-secondary !py-2">Update</button>
                                                    </div>
                                                </div>
                                            )}

                                            {/* SKELETON LOADER */}
                                            {isInitializing ? (
                                                <div className="h-[46px] w-full bg-[var(--input-background)] border border-[var(--input-border)] rounded animate-pulse"></div>
                                            ) : (
                                                <select className="form-input" value={selectedTemplate} onChange={e => setSelectedTemplate(e.target.value)}>
                                                    <option value="" disabled>-- Select a Google Doc Template --</option>
                                                    {templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                </select>
                                            )}
                                        </div>
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-[var(--border-moderate)] flex justify-end shrink-0">
                                        <button onClick={handleStep1Next} className="btn btn-primary">
                                            Next: Audience <i className="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2: AUDIENCE */}
                            {step === 2 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-6 border-b border-[var(--border-moderate)] pb-4 shrink-0">
                                        <h2 className="text-2xl font-bold flex items-center gap-2">
                                            <i className="fa-solid fa-users-viewfinder text-[var(--brand-primary)]"></i> Select Audience
                                        </h2>
                                        <p className="text-[var(--text-secondary)] mt-1 text-sm">Connect your Google Sheet and validate the required merge fields.</p>
                                    </div>
                                    <div className="space-y-6 flex-grow overflow-y-auto custom-scrollbar pr-2">
                                        <div className="app-card">
                                            
                                            {/* --- UPDATED URL INPUT HEADER --- */}
                                            <div className="flex justify-between items-end mb-2">
                                                <label className="block text-sm font-semibold text-[var(--text-secondary)]">Google Sheet URL</label>
                                                <button 
                                                    onClick={handleGenerateSheet} 
                                                    disabled={isGeneratingSheet || !selectedTemplate} 
                                                    className="text-xs text-[var(--brand-primary)] hover:text-white transition-colors font-semibold flex items-center gap-1.5 bg-black/20 px-2 py-1 rounded border border-[var(--brand-primary)]/30 hover:border-[var(--brand-primary)] disabled:opacity-50"
                                                    title="Auto-create a perfectly formatted Google Sheet"
                                                >
                                                    {isGeneratingSheet ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-wand-magic-sparkles"></i>}
                                                    {isGeneratingSheet ? "Creating Sheet..." : "Auto-Generate Sheet"}
                                                </button>
                                            </div>
                                            
                                            <input type="text" placeholder="https://docs.google.com/spreadsheets/d/..." className="form-input mb-4" value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} />
                                            {/* --- UPDATED TAB SELECTION UI --- */}
                                            <label className="block text-sm font-semibold text-[var(--text-secondary)] mb-2 flex items-center gap-2">
                                                Select Tab
                                                {isFetchingTabs && <i className="fa-solid fa-circle-notch fa-spin text-[var(--brand-primary)]"></i>}
                                            </label>
                                            <select 
                                                className="form-input mb-4" 
                                                disabled={sheetTabs.length === 0 || isFetchingTabs} 
                                                value={selectedTab} 
                                                onChange={e => setSelectedTab(e.target.value)}
                                            >
                                                {isFetchingTabs ? (
                                                    <option>Loading tabs...</option>
                                                ) : sheetTabs.length === 0 ? (
                                                    <option>Enter URL to load tabs...</option>
                                                ) : (
                                                    sheetTabs.map(t => <option key={t} value={t}>{t}</option>)
                                                )}
                                            </select>

                                            <button onClick={handleValidateSheet} disabled={!sheetUrl || !selectedTab || isValidating || isFetchingTabs} className="btn btn-secondary w-full">
                                                {isValidating ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Validating...</> : <><i className="fa-solid fa-bolt"></i> Validate Columns</>}
                                            </button>
                                        </div>

                                        {validationState.status !== 'idle' && (
                                            <div className="bg-black/20 rounded-lg border border-[var(--border-weak)] overflow-hidden">
                                                <div className="bg-[var(--surface-primary)] p-3 border-b border-[var(--border-moderate)] font-semibold text-sm flex justify-between items-center">
                                                    <span className="text-[var(--text-secondary)]">Template Requirements</span>
                                                    {validationState.status === 'success' 
                                                        ? <span className="text-xs px-2 py-1 rounded-full bg-[var(--status-success)]/20 border border-[var(--status-success)]/50 text-[var(--status-success)] font-bold"><i className="fa-solid fa-check"></i> Valid</span>
                                                        : <span className="text-xs px-2 py-1 rounded-full bg-[var(--status-critical)]/20 border border-[var(--status-critical)]/50 text-[var(--status-critical)] font-bold"><i className="fa-solid fa-xmark"></i> Missing Fields</span>
                                                    }
                                                </div>
                                                <div className="p-4 max-h-48 overflow-y-auto custom-scrollbar">
                                                    {validationState.status === 'error' && (
                                                        <p className="text-sm text-[var(--status-critical)] mb-3">Please ensure your Google Sheet contains these exact headers:</p>
                                                    )}
                                                    
                                                    {/* UPDATED: SCANNABILITY & SORTING */}
                                                    <ul className="space-y-2">
                                                        {[...(validationState.details?.templateHeaders || [])]
                                                            .sort((a, b) => {
                                                                const aMissing = validationState.details.missingKeywords.includes(a);
                                                                const bMissing = validationState.details.missingKeywords.includes(b);
                                                                return (aMissing === bMissing) ? 0 : aMissing ? -1 : 1;
                                                            })
                                                            .map(h => {
                                                                const isMissing = validationState.details.missingKeywords.includes(h);
                                                                return (
                                                                    <li key={h} className={`flex items-center justify-between p-2 rounded border ${isMissing ? 'bg-[var(--status-critical)]/10 border-[var(--status-critical)]/30' : 'bg-[var(--status-success)]/10 border-[var(--status-success)]/30'}`}>
                                                                        <span className={`font-mono text-sm ${isMissing ? 'text-[var(--status-critical)] font-bold' : 'text-[var(--status-success)]'}`}>{`{{${h}}}`}</span>
                                                                        {isMissing ? (
                                                                            <span className="text-[10px] text-[var(--status-critical)] uppercase font-bold tracking-wider bg-[var(--status-critical)]/20 px-2 py-0.5 rounded">Missing</span>
                                                                        ) : (
                                                                            <i className="fa-solid fa-check text-[var(--status-success)]"></i>
                                                                        )}
                                                                    </li>
                                                                );
                                                            })}
                                                    </ul>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-[var(--border-moderate)] flex justify-between items-center shrink-0">
                                        <button onClick={() => setStep(1)} className="btn btn-secondary border-transparent"><i className="fa-solid fa-arrow-left"></i> Back</button>
                                        <button onClick={() => setStep(3)} disabled={validationState.status !== 'success'} className="btn btn-primary">Next: Preview <i className="fa-solid fa-arrow-right"></i></button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 3: PREVIEW & SEND */}
                            {step === 3 && (
                                <div className="flex flex-col h-full animate-fade-in">
                                    <div className="mb-4 border-b border-[var(--border-moderate)] pb-4 flex justify-between items-end shrink-0">
                                        <div>
                                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                                <i className="fa-solid fa-envelope-open-text text-[var(--brand-primary)]"></i> Final Review
                                            </h2>
                                            <p className="text-[var(--text-secondary)] mt-1 text-sm">Add a subject line and review the rendered email.</p>
                                        </div>
                                        {/* UPDATED: The Dispatch Button was removed from here. */}
                                    </div>

                                    <div className="flex-grow flex flex-col min-h-0">
                                        <div className="mb-4 flex gap-2">
                                            <input type="text" placeholder="Email Subject Line (e.g. Hi {{Name}}!)" className="form-input flex-grow" value={subjectLine} onChange={e => setSubjectLine(e.target.value)} />
                                            <button onClick={handleGeneratePreview} className="btn btn-secondary whitespace-nowrap"><i className="fa-solid fa-eye"></i> Gen Preview</button>
                                        </div>

                                        {/* DELIVERY REPORT UI */}
                                        {sendResults && (
                                            <div className={`mb-4 p-4 rounded-lg border shadow-inner ${sendResults.failed.length > 0 ? 'bg-[var(--status-critical)]/10 border-[var(--status-critical)]/30' : 'bg-[var(--status-success)]/10 border-[var(--status-success)]/30'}`}>
                                                <h4 className="font-bold mb-3 flex items-center gap-2 text-sm uppercase tracking-wide text-white">
                                                    <i className="fa-solid fa-chart-pie"></i> Delivery Report
                                                </h4>
                                                <div className="flex gap-6 text-sm mb-1 font-medium">
                                                    <span className="text-[var(--status-success)]"><i className="fa-solid fa-paper-plane mr-1"></i> Sent: <strong>{sendResults.sent}</strong></span>
                                                    <span className="text-[var(--text-secondary)]"><i className="fa-solid fa-forward-step mr-1"></i> Skipped: <strong>{sendResults.skipped}</strong></span>
                                                    <span className={sendResults.failed.length > 0 ? 'text-[var(--status-critical)]' : 'text-[var(--text-secondary)]'}><i className="fa-solid fa-triangle-exclamation mr-1"></i> Failed: <strong>{sendResults.failed.length}</strong></span>
                                                </div>
                                                
                                                {/* Explain the skipped emails behavior contextually */}
                                                {sendResults.skipped > 0 && sendResults.sent === 0 && (
                                                    <p className="text-xs text-[var(--text-secondary)] mt-2 italic bg-black/20 p-2 rounded">
                                                        * To re-send to skipped contacts, clear the contents of the "Timestamp" column in your Google Sheet.
                                                    </p>
                                                )}

                                                {/* Map out specific failures if they exist */}
                                                {sendResults.failed.length > 0 && (
                                                    <div className="mt-3 max-h-32 overflow-y-auto custom-scrollbar bg-black/40 p-3 rounded text-xs text-[var(--status-critical)] border border-[var(--status-critical)]/20">
                                                        <ul className="list-disc pl-4 space-y-1">
                                                            {sendResults.failed.map((f, i) => (
                                                                <li key={i}><strong>{f.email || 'Unknown'}</strong>: {f.error}</li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="flex-grow flex flex-col bg-white rounded-lg overflow-hidden border border-[var(--border-moderate)] text-slate-800 min-h-0">
                                            <div className="bg-slate-100 border-b border-slate-200 p-2 px-4 flex justify-between items-center text-xs text-slate-500 shrink-0">
                                                <span><i className="fa-solid fa-eye"></i> Recipient Preview</span>
                                                
                                                {/* Pagination Controls */}
                                                {previewData && (
                                                    <div className="flex items-center gap-2 bg-white rounded shadow-sm border border-slate-200">
                                                        <button 
                                                            onClick={() => fetchPreview(previewIndex - 1)} 
                                                            disabled={previewIndex === 0 || isFetchingPreview} 
                                                            className="px-2 py-1 hover:bg-slate-50 border-r border-slate-200 disabled:opacity-50">
                                                            <i className="fa-solid fa-chevron-left"></i>
                                                        </button>
                                                        <span className="font-semibold px-2 w-28 text-center">Row {previewData.currentRow} of {previewData.totalRows}</span>
                                                        <button 
                                                            onClick={() => fetchPreview(previewIndex + 1)} 
                                                            disabled={previewIndex >= previewData.totalRows - 1 || isFetchingPreview} 
                                                            className="px-2 py-1 hover:bg-slate-50 border-l border-slate-200 disabled:opacity-50">
                                                            <i className="fa-solid fa-chevron-right"></i>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="bg-slate-50 border-b border-slate-200 p-4 text-sm shrink-0">
                                                <div className="flex mb-1"><span className="w-16 text-slate-500">From:</span> <span className="font-semibold">{selectedAlias}</span></div>
                                                <div className="flex mb-1"><span className="w-16 text-slate-500">To:</span> <span className="font-semibold">{previewData ? previewData.toEmail : <span className="italic text-slate-400">Loading...</span>}</span></div>
                                                <div className="flex"><span className="w-16 text-slate-500">Subject:</span> <HighlightedSubject text={subjectLine} /></div>
                                            </div>
                                            
                                            {/* HTML Body Render */}
                                            {isFetchingPreview ? (
                                                <div className="flex items-center justify-center flex-grow p-8 bg-white"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-slate-300"></i></div>
                                            ) : (
                                                <div className="p-6 overflow-y-auto custom-scrollbar flex-grow bg-white text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: previewData?.html || '<p class="text-slate-400 italic text-center mt-10">Click "Gen Preview" to render template.</p>' }}></div>
                                            )}
                                        </div>
                                    </div>

                                    {/* UPDATED: Primary Action Placement in Footer */}
                                    <div className="mt-4 pt-4 border-t border-[var(--border-moderate)] flex justify-between shrink-0">
                                        <button onClick={() => setStep(2)} className="btn btn-secondary border-transparent">
                                            <i className="fa-solid fa-arrow-left"></i> Back
                                        </button>
                                        
                                        <button 
                                            onClick={handleSendEmails} 
                                            disabled={isSending || !subjectLine} 
                                            className="btn btn-primary !py-3 !px-6 !text-sm shadow-[0_0_15px_rgba(34,211,238,0.3)]"
                                        >
                                            {isSending ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Sending...</> : <><i className="fa-solid fa-paper-plane"></i> Dispatch Emails</>}
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                        {/* RIGHT COLUMN: Summary Sidebar */}
                        <div className="w-full md:w-80 bg-black/20 border-l border-[var(--border-moderate)] p-6 flex flex-col shadow-inner shrink-0">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-sm font-bold text-[var(--text-secondary)] uppercase tracking-[0.05em] flex items-center gap-2 m-0">
                                    <i className="fa-solid fa-list-check"></i> Summary
                                </h3>
                                {(selectedTemplate || sheetUrl || subjectLine) && (
                                    <button 
                                        onClick={handleStartOver} 
                                        className="text-xs font-semibold text-[var(--text-disabled)] hover:text-[var(--status-critical)] transition-colors flex items-center gap-1.5"
                                        title="Reset entire campaign"
                                    >
                                        <i className="fa-solid fa-arrow-rotate-left"></i> Start Over
                                    </button>
                                )}
                            </div>

                            <div className="flex flex-col flex-grow">
                                <div className="summary-item">
                                    <span className="summary-label">Sender</span>
                                    {selectedAlias ? <div className="summary-value"><i className="fa-solid fa-circle-check text-[var(--brand-primary)]"></i> <span className="truncate">{selectedAlias}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Template</span>
                                    {selectedTemplate ? <div className="summary-value"><i className="fa-solid fa-file-lines text-[var(--brand-primary)]"></i> <span className="truncate">{getTemplateName()}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Audience Data</span>
                                    {validationState.status === 'success' ? <div className="summary-value"><i className="fa-solid fa-table text-[var(--status-success)]"></i> <span className="text-[var(--status-success)]">Sheet Validated</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                                <div className="summary-item">
                                    <span className="summary-label">Subject Line</span>
                                    {subjectLine ? <div className="summary-value"><i className="fa-solid fa-pen text-[var(--brand-primary)]"></i> <span className="truncate">{subjectLine}</span></div> : <div className="summary-value pending">Pending...</div>}
                                </div>
                            </div>
                            
                            {/* Missing Sidebar Info Box */}
                            <div className="mt-auto bg-[var(--surface-primary)] border border-[var(--border-weak)] rounded-lg p-4 text-xs text-[var(--text-secondary)] leading-relaxed">
                                <i className="fa-solid fa-circle-info text-[var(--brand-primary)] mb-2 text-base"></i><br/>
                                Emails are sent sequentially via Google Workspace. Ensure you respect your daily quota limits to avoid bounces.
                            </div>
                        </div>
                    </div>
                </main>

            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AirPostApp />);
</script>

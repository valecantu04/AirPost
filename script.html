<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- UTILITY: Wrap google.script.run in a Promise ---
    const runGas = (functionName, ...args) => {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [functionName](...args);
        });
    };

    const WORKFLOW_STEPS = [
        { id: 'setup', label: 'Campaign Setup' },
        { id: 'audience', label: 'Audience' },
        { id: 'preview', label: 'Preview & Send' },
    ];

    const Stepper = ({ steps, currentStep, onStepClick }) => {
        // Mathematically calculate progress width based on dynamic step array
        const totalSteps = steps.length;
        const progressWidth = ((currentStep - 1) / (totalSteps - 1)) * 100;

        return (
            <div className="w-full relative pt-2 pb-8 mb-4">
                
                {/* --- TRACK CONTAINER --- */}
                {/* left-[1.25rem] and right-[1.25rem] perfectly align the track to the center of the w-10 (2.5rem) circular nodes */}
                <div className="absolute top-[1.4rem] left-[1.25rem] right-[1.25rem] h-1 z-0">
                    {/* Inactive Background Track */}
                    <div className="absolute inset-0 w-full h-full bg-[var(--border-moderate)] rounded"></div>
                    {/* Active Progress Track */}
                    <div 
                        className="absolute top-0 left-0 h-full bg-[var(--brand-primary)] rounded transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] shadow-[0_0_10px_var(--brand-primary)]"
                        style={{ width: `${progressWidth}%` }}
                    ></div>
                </div>

                {/* --- STEP NODES --- */}
                <div className="relative z-10 flex justify-between">
                    {steps.map((step, index) => {
                        const stepNum = index + 1;
                        const isCompleted = currentStep > stepNum;
                        const isActive = currentStep === stepNum;
                        
                        // Determine styles based on state
                        let nodeClasses = "w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 ease-in-out border-2 ";
                        let textClasses = "absolute top-12 text-center w-28 text-sm font-semibold transition-colors duration-300 ";

                        if (isCompleted) {
                            // Completed State
                            nodeClasses += "bg-[var(--brand-primary)] border-[var(--surface-primary)] text-[#020f24] cursor-pointer hover:scale-105 hover:shadow-[0_0_15px_rgba(34,211,238,0.5)]";
                            textClasses += "text-white cursor-pointer";
                        } else if (isActive) {
                            // Active State
                            nodeClasses += "bg-[var(--brand-primary)] border-[var(--surface-primary)] text-[#020f24] shadow-[0_0_15px_rgba(34,211,238,0.6)] scale-105";
                            textClasses += "text-white";
                        } else {
                            // Upcoming State
                            nodeClasses += "bg-[var(--surface-primary)] border-[var(--border-moderate)] text-[var(--text-secondary)]";
                            textClasses += "text-[var(--text-disabled)]";
                        }

                        return (
                            <div key={step.id} className="flex flex-col items-center relative">
                                <button 
                                    onClick={() => isCompleted && onStepClick(stepNum)}
                                    disabled={!isCompleted}
                                    className={nodeClasses}
                                    aria-label={`Step ${stepNum}: ${step.label}`}
                                    aria-current={isActive ? "step" : undefined}
                                >
                                    {isCompleted ? <i className="fa-solid fa-check"></i> : stepNum}
                                </button>
                                <span 
                                    className={textClasses}
                                    onClick={() => isCompleted && onStepClick(stepNum)}
                                >
                                    {step.label}
                                </span>
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    };

    const ConfirmModal = ({ isOpen, title, message, onConfirm, onClose, isDanger }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
                <div className="wizard-layout relative z-10 w-full max-w-sm p-6 flex flex-col gap-4">
                    <h2 className="text-lg font-bold text-white m-0">{title}</h2>
                    <p className="text-[var(--text-secondary)] text-sm m-0">{message}</p>
                    <div className="flex justify-end gap-3 pt-2">
                        <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                        <button className={`btn ${isDanger ? 'btn-danger' : 'btn-primary'}`} onClick={onConfirm}>Confirm</button>
                    </div>
                </div>
            </div>
        );
    };

    const HighlightedSubject = ({ text }) => {
        if (!text) return <span className="subject-placeholder">(Enter subject above)</span>;
        const parts = text.split(/({{.*?}})/g);
        return (
            <span>
                {parts.map((part, i) => {
                    if (part.startsWith('{{') && part.endsWith('}}')) {
                        return <span key={i} className="bg-cyan-100 text-cyan-800 px-1 rounded font-semibold">{part.replace(/[{}]/g, '')}</span>;
                    }
                    return <span key={i}>{part}</span>;
                })}
            </span>
        );
    };

    const ToastContainer = ({ toasts }) => (
        <div className="absolute top-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none">
            {toasts.map(toast => (
                <div key={toast.id} className={`${toast.isExiting ? 'toast-exit' : 'toast-enter'} pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-2xl border-l-4 ${toast.type === 'success' ? 'border-[var(--status-success)]' : 'border-[var(--status-critical)]'} bg-[var(--surface-primary)] text-white min-w-[280px] max-w-[350px] border border-[var(--border-moderate)]`}>
                    <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-[var(--status-success)]' : 'fa-triangle-exclamation text-[var(--status-critical)]'} text-xl`}></i>
                    <div className="flex flex-col">
                        <span className="font-bold text-sm tracking-wide uppercase">{toast.type === 'success' ? 'Success' : 'Notice'}</span>
                        <span className="text-xs text-[var(--text-secondary)] mt-0.5">{toast.message}</span>
                    </div>
                </div>
            ))}
        </div>
    );

    const AirPostApp = () => {
        // --- GLOBAL STATE ---
        const [step, setStep] = useState(1);
        const [activeTab, setActiveTab] = useState('campaign');
        const [isInitializing, setIsInitializing] = useState(true);
        const [globalData, setGlobalData] = useState({ userEmail: '', totalSent: 0 });
        const [toasts, setToasts] = useState([]);
        
        // Get logo from window — converted to data URL to avoid inline SVG execution surface
        const logoSvg = window.LOGO_SVG || '';
        const logoDataUrl = logoSvg ? `data:image/svg+xml,${encodeURIComponent(logoSvg)}` : '';

        // Form State
        const [aliases, setAliases] = useState([]);
        const [templates, setTemplates] = useState([]);
        const [selectedAlias, setSelectedAlias] = useState('');
        const [selectedTemplate, setSelectedTemplate] = useState('');
        const [showFolderSettings, setShowFolderSettings] = useState(false);
        const [isUpdatingFolder, setIsUpdatingFolder] = useState(false);
        const [folderName, setFolderName] = useState('');
        const [currentFolderId, setCurrentFolderId] = useState('');
        const [folderIdInput, setFolderIdInput] = useState('');
        
        // Audience State
        const [sheetUrl, setSheetUrl] = useState('');
        const [sheetTabs, setSheetTabs] = useState([]);
        const [selectedTab, setSelectedTab] = useState('');
        const [validationState, setValidationState] = useState({ status: 'idle', details: null });
        const [isValidating, setIsValidating] = useState(false);
        const [isFetchingTabs, setIsFetchingTabs] = useState(false);
        const [isGeneratingSheet, setIsGeneratingSheet] = useState(false);

        // Preview & Send State
        const [subjectLine, setSubjectLine] = useState('');
        const [previewData, setPreviewData] = useState(null);
        const [previewIndex, setPreviewIndex] = useState(0);
        const [isFetchingPreview, setIsFetchingPreview] = useState(false);
        const [isSending, setIsSending] = useState(false);
        const [sendResults, setSendResults] = useState(null);

        // Modal State
        const [modal, setModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null, isDanger: false });
        const openModal = ({ title, message, onConfirm, isDanger = false }) =>
            setModal({ isOpen: true, title, message, onConfirm, isDanger });
        const closeModal = () => setModal(prev => ({ ...prev, isOpen: false }));
        const handleModalConfirm = () => { modal.onConfirm?.(); closeModal(); };

        const [draftStartDate, setDraftStartDate] = useState(() => {
            const d = new Date();
            d.setDate(d.getDate() - 7);
            return d.toISOString().slice(0, 10);
        });
        const [draftEndDate, setDraftEndDate] = useState(() => new Date().toISOString().slice(0, 10));
        const [drafts, setDrafts] = useState([]);
        const [isFetchingDrafts, setIsFetchingDrafts] = useState(false);
        const [expandedDraftId, setExpandedDraftId] = useState(null);
        const [draftContentCache, setDraftContentCache] = useState({});
        const [selectedDraftIds, setSelectedDraftIds] = useState(() => new Set());
        const [isSendingDrafts, setIsSendingDrafts] = useState(false);
        const [draftSendResults, setDraftSendResults] = useState(null);
        const [draftsNextPageToken, setDraftsNextPageToken] = useState(null);
        const [isLoadingMoreDrafts, setIsLoadingMoreDrafts] = useState(false);

        // --- STEPPER NAVIGATION ---
        const handleStepperClick = (targetStep) => {
            // Users can only click backward to completed steps, preventing them from skipping validation
            if (targetStep < step) {
                setStep(targetStep);
            }
        };

        // --- INITIALIZATION ---
        useEffect(() => {
            const initApp = async () => {
                try {
                    const [email, totalCount, aliasesData, templatesData, fName, fId] = await Promise.all([
                        runGas('getUserEmail'),
                        runGas('getTotalSentEmailCount'),
                        runGas('getSendAsAliases'),
                        runGas('getTemplates'),
                        runGas('getTemplateFolderName'),
                        runGas('getTemplateFolderId')
                    ]);
                    
                    setGlobalData({ userEmail: email, totalSent: totalCount });
                    setAliases(aliasesData || []);
                    setTemplates(templatesData || []);
                    
                    // Set Folder Data
                    setFolderName(fName || 'Unknown Folder');
                    setCurrentFolderId(fId || '');
                    setFolderIdInput(fId || ''); // Pre-fill the input field

                    if (aliasesData && aliasesData.length > 0) {
                        setSelectedAlias(aliasesData[0].email);
                    }
                } catch (error) {
                    addToast('Failed to load application data', 'error');
                } finally {
                    setIsInitializing(false);
                }
            };
            initApp();
        }, []);

        // --- TOAST SYSTEM ---
        const addToast = (message, type = 'success') => {
            const id = Date.now();
            
            // 1. Add the toast with an isExiting flag set to false
            setToasts(prev => [...prev, { id, message, type, isExiting: false }]);
            
            // 2. Trigger the fade-out animation slightly before removal (at 3.6 seconds)
            setTimeout(() => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, isExiting: true } : t));
            }, 3600);

            // 3. Physically remove the element from the DOM (at 4 seconds)
            setTimeout(() => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, 4000);
        };

        // --- STEP 1 LOGIC ---
        const handleUpdateFolder = async () => {
            if (!folderIdInput) return;

            // If the user pasted a full URL, extract the ID. Otherwise, assume they pasted the raw ID.
            const idMatch = folderIdInput.match(/[-\w]{25,}/);
            const finalFolderId = idMatch ? idMatch[0] : folderIdInput.trim();
            setIsUpdatingFolder(true);
            try {
                await runGas('setTemplateFolderId', finalFolderId);
                addToast('Source folder updated!', 'success');

                // --- RE-FETCH DATA UPON SUCCESSFUL FOLDER CHANGE ---
                const [newTemplates, newFName, newFId] = await Promise.all([
                    runGas('getTemplates'),
                    runGas('getTemplateFolderName'),
                    runGas('getTemplateFolderId')
                ]);

                setTemplates(newTemplates || []);
                setFolderName(newFName || 'Unknown Folder');
                setCurrentFolderId(newFId || finalFolderId);
                setSelectedTemplate('');
                setShowFolderSettings(false);
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsUpdatingFolder(false);
            }
        };

        const handleStep1Next = () => {
            if (!selectedAlias || !selectedTemplate) {
                addToast('Please select a sender and template.', 'error');
                return;
            }
            setStep(2);
        };

        // --- STEP 2 LOGIC ---
        const handleExtractTabs = useCallback(async () => {
            if (!sheetUrl) return;
            // Invalidate downstream state now that a real fetch is beginning
            setValidationState({ status: 'idle', details: null });
            setPreviewData(null);
            setPreviewIndex(0);
            setSendResults(null);
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) {
                addToast('Invalid Google Sheet URL', 'error');
                return;
            }
            setIsFetchingTabs(true);
            try {
                const tabs = await runGas('getSheetTabs', sheetIdMatch[0]);
                setSheetTabs(tabs);
                if (tabs.length > 0 && !tabs.includes(selectedTab)) {
                    setSelectedTab(tabs[0]);
                } else if (tabs.length === 0) {
                    setSelectedTab('');
                }
            } catch (err) {
                addToast('Failed to load tabs. Ensure you have access to the Sheet.', 'error');
            } finally {
                setIsFetchingTabs(false); // --- END LOADING ---
            }
        }, [sheetUrl]);

        // --- HANDLE SHEET GENERATION ---
        const handleGenerateSheet = async () => {
            setIsGeneratingSheet(true);
            try {
                // Call backend to create the sheet
                const url = await runGas('generateAudienceSheet', selectedTemplate, currentFolderId);
                
                // Automatically populate the input field with the new URL
                setSheetUrl(url);
                
                addToast('Sheet generated perfectly! Please open it to add your contacts.', 'success');
                
                // Pop open the new sheet in a new tab so the user can immediately add data
                window.open(url, '_blank');
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsGeneratingSheet(false);
            }
        };

        // 1. Handle URL Debouncing separately
        useEffect(() => {
            const delayDebounceFn = setTimeout(() => {
                if (sheetUrl) handleExtractTabs();
            }, 1000);
            return () => clearTimeout(delayDebounceFn);
        }, [sheetUrl]);

        // 2. CORNER CASE FIX: Centralized State Invalidator
        // If the Template or Tab changes, wipe all downstream progress.
        // sheetUrl changes are handled inside handleExtractTabs after debounce resolves.
        useEffect(() => {
            setValidationState({ status: 'idle', details: null });
            setPreviewData(null);
            setPreviewIndex(0);
            setSendResults(null);
        }, [selectedTemplate, selectedTab]);

        // 3. Keyboard navigation for preview pane (← →) — scoped away from text inputs
        useEffect(() => {
            if (step !== 3 || !previewData || isFetchingPreview) return;
            const onKey = (e) => {
                const tag = document.activeElement?.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                if (e.key === 'ArrowLeft' && previewIndex > 0)
                    fetchPreview(previewIndex - 1);
                if (e.key === 'ArrowRight' && previewIndex < previewData.totalRows - 1)
                    fetchPreview(previewIndex + 1);
            };
            document.addEventListener('keydown', onKey);
            return () => document.removeEventListener('keydown', onKey);
        }, [step, previewData, previewIndex, isFetchingPreview]);

        // 4. Auto-generate preview on step 3 entry if subject is ready and no preview loaded
        useEffect(() => {
            if (step === 3 && subjectLine.trim() && !previewData) {
                fetchPreview(0);
            }
        }, [step]);

        const handleValidateSheet = async () => {
            if (!sheetUrl || !selectedTab) return addToast('URL and Tab required.', 'error');
            
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) return addToast('Invalid sheet URL.', 'error');
            setIsValidating(true);
            try {
                const sheetId = sheetIdMatch[0];
                const result = await runGas('validateSheetColumns', sheetId, selectedTemplate, selectedTab);
                
                setValidationState({ 
                    status: result.valid ? 'success' : 'error', 
                    details: result 
                });

                if (result.valid) addToast('Sheet validated successfully!', 'success');
                else addToast('Missing required columns in sheet.', 'error');
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsValidating(false);
            }
        };

        // --- STEP 3 LOGIC ---
        const fetchPreview = async (index) => {
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) return addToast('Invalid sheet URL.', 'error');
            setIsFetchingPreview(true);
            try {
                const sheetId = sheetIdMatch[0];
                const res = await runGas('generateEmailPreview', sheetId, selectedTemplate, selectedTab, index);
                setPreviewData(res);
                setPreviewIndex(index);
            } catch (err) {
                addToast('Failed to generate preview', 'error');
            } finally {
                setIsFetchingPreview(false);
            }
        };

        const handleGeneratePreview = () => {
            // CORNER CASE FIX: Prevent whitespace-only subjects
            if (!subjectLine.trim()) {
                addToast('Please enter a valid subject line.', 'error');
                return;
            }
            fetchPreview(0); 
        };

        const executeSend = async () => {
            const sheetIdMatch = sheetUrl.match(/[-\w]{25,}/);
            if (!sheetIdMatch) return addToast('Invalid sheet URL.', 'error');
            setIsSending(true);
            setSendResults(null);
            try {
                const sheetId = sheetIdMatch[0];
                const selectedAliasObj = aliases.find(a => a.email === selectedAlias);
                
                const res = await runGas('sendEmailsWithSheet', sheetId, selectedTemplate, subjectLine, selectedTab, selectedAlias, selectedAliasObj.displayName);
                
                if (res.success) {
                    setSendResults(res.details); // Store the payload
                    
                    // Dynamic toast messaging based on results
                    if (res.details.failed && res.details.failed.length > 0) {
                        addToast(`Sent ${res.details.sent}, but ${res.details.failed.length} failed.`, 'error');
                    } else if (res.details.sent > 0) {
                        addToast(`Successfully sent ${res.details.sent} emails!`, 'success');
                    } else if (res.details.skipped > 0) {
                        addToast(`0 sent. ${res.details.skipped} skipped (already processed).`, 'success');
                    } else {
                        addToast(`0 emails sent. No valid emails found in sheet.`, 'error');
                    }
                    
                    runGas('getTotalSentEmailCount').then(count => setGlobalData(prev => ({...prev, totalSent: count})));
                } else {
                    addToast('Failed to execute send operation.', 'error');
                }
            } catch (err) {
                addToast(err.message, 'error');
            } finally {
                setIsSending(false);
            }
        };

        const handleSendEmails = () => {
            // CORNER CASE FIX: Prevent whitespace-only subjects
            if (!subjectLine.trim()) return addToast('Subject is required.', 'error');
            openModal({
                title: 'Dispatch Emails',
                message: 'Are you sure you want to send emails? This cannot be undone.',
                onConfirm: executeSend,
                isDanger: true,
            });
        };

        // --- RESET LOGIC ---
        const executeStartOver = () => {
            // Reset to step 1
            setStep(1);
            
            // Reset Configuration
            if (aliases && aliases.length > 0) {
                setSelectedAlias(aliases[0].email);
            } else {
                setSelectedAlias('');
            }
            setSelectedTemplate('');
            
            // Reset Audience
            setSheetUrl('');
            setSheetTabs([]);
            setSelectedTab('');
            setValidationState({ status: 'idle', details: null });
            
            // Reset Preview & Send
            setSubjectLine('');
            setPreviewData(null);
            setPreviewIndex(0);
            setSendResults(null);
            
            addToast('Campaign reset successfully.', 'success');
        };

        const handleStartOver = () => {
            openModal({
                title: 'Start Over',
                message: 'Are you sure you want to start over? All current progress will be lost.',
                onConfirm: executeStartOver,
            });
        };

        const fetchDrafts = async () => {
            setIsFetchingDrafts(true);
            setDraftSendResults(null);
            setExpandedDraftId(null);
            setDraftsNextPageToken(null);
            try {
                const { drafts: results, nextPageToken } = await runGas('getDrafts', draftStartDate, draftEndDate);
                setDrafts(results);
                setDraftsNextPageToken(nextPageToken);
                setDraftContentCache({});
                setSelectedDraftIds(new Set(results.map(d => d.id)));
            } catch (err) {
                addToast('Failed to load drafts. Please try again.', 'error');
                setDrafts([]);
                setSelectedDraftIds(new Set());
                setDraftContentCache({});
            } finally {
                setIsFetchingDrafts(false);
            }
        };

        const loadMoreDrafts = async () => {
            setIsLoadingMoreDrafts(true);
            try {
                const { drafts: moreResults, nextPageToken } = await runGas('getDrafts', draftStartDate, draftEndDate, draftsNextPageToken);
                setDrafts(prev => [...prev, ...moreResults]);
                setDraftsNextPageToken(nextPageToken);
                setSelectedDraftIds(prev => {
                    const next = new Set(prev);
                    moreResults.forEach(d => next.add(d.id));
                    return next;
                });
            } catch (err) {
                addToast('Failed to load more drafts. Please try again.', 'error');
            } finally {
                setIsLoadingMoreDrafts(false);
            }
        };

        const toggleDraftSelection = (id) => {
            setSelectedDraftIds(prev => {
                const next = new Set(prev);
                next.has(id) ? next.delete(id) : next.add(id);
                return next;
            });
        };

        const toggleAllDrafts = () => {
            if (selectedDraftIds.size === drafts.length && drafts.length > 0) {
                setSelectedDraftIds(new Set());
            } else {
                setSelectedDraftIds(new Set(drafts.map(d => d.id)));
            }
        };

        const handleExpandDraft = async (draftId) => {
            if (expandedDraftId === draftId) {
                setExpandedDraftId(null);
                return;
            }
            setExpandedDraftId(draftId);
            if (draftContentCache[draftId]) return;
            try {
                const html = await runGas('getDraftContent', draftId);
                setDraftContentCache(prev => ({ ...prev, [draftId]: html }));
            } catch (err) {
                setDraftContentCache(prev => ({
                    ...prev,
                    [draftId]: '<p style="color:#ff5664;font-style:italic;padding:12px">Could not load preview.</p>'
                }));
            }
        };

        const handleSendDrafts = () => {
            const count = selectedDraftIds.size;
            if (count === 0) return;
            openModal({
                title: 'Send Drafts',
                message: `Send ${count} draft${count === 1 ? '' : 's'}? They will be permanently deleted from your Gmail Drafts folder.`,
                isDanger: true,
                onConfirm: executeSendDrafts,
            });
        };

        const executeSendDrafts = async () => {
            setIsSendingDrafts(true);
            try {
                const ids = Array.from(selectedDraftIds);
                const results = await runGas('sendDrafts', ids);
                setDraftSendResults(results);

                const sentIds = new Set(results.filter(r => r.success).map(r => r.draftId));
                setDrafts(prev => prev.filter(d => !sentIds.has(d.id)));
                setSelectedDraftIds(prev => {
                    const next = new Set(prev);
                    sentIds.forEach(id => next.delete(id));
                    return next;
                });
                setExpandedDraftId(null);
                setDraftContentCache(prev => {
                    const next = { ...prev };
                    sentIds.forEach(id => delete next[id]);
                    return next;
                });

                const sentCount = sentIds.size;
                const failedCount = results.length - sentCount;

                if (failedCount === 0) {
                    addToast(`${sentCount} draft${sentCount === 1 ? '' : 's'} sent successfully.`, 'success');
                } else if (sentCount === 0) {
                    addToast('Send failed. Your drafts were not deleted.', 'error');
                } else {
                    addToast(`${sentCount} sent, ${failedCount} failed.`, 'error');
                }
            } catch (err) {
                addToast('Send failed. Please try again.', 'error');
            } finally {
                setIsSendingDrafts(false);
            }
        };

        const getTemplateName = () => templates.find(t => t.id === selectedTemplate)?.name || 'Pending...';

        return (
            <div className="flex flex-col h-screen">
                <ConfirmModal
                    isOpen={modal.isOpen}
                    title={modal.title}
                    message={modal.message}
                    onConfirm={handleModalConfirm}
                    onClose={closeModal}
                    isDanger={modal.isDanger}
                />
                {/* HEADER */}
                <header className="border-b border-[var(--border-moderate)] px-6 mb-4 flex items-stretch bg-[var(--surface-primary)]/40 backdrop-blur-md sticky top-0 z-50 shrink-0">
                    <div className="flex flex-col justify-center py-3 mr-8">
                        <h1 className="font-bold text-2xl tracking-tight text-white m-0 flex items-center gap-2">
                            <i className="fa-solid fa-paper-plane text-[var(--brand-primary)]"></i> AirPost
                        </h1>

                                            <p className="text-[var(--text-secondary)] mt-1 text-sm">Filter, preview, and send emails from your Gmail Drafts.</p>
                                        </div>
                                        <div className="flex flex-col items-end shrink-0">
                                            <div className="flex items-center gap-2 bg-black/20 border border-[var(--border-moderate)] rounded-lg px-3 py-2">
                                                <span className="text-xs font-semibold text-[var(--text-secondary)] uppercase tracking-wider">Created</span>
                                                <input
                                                    type="date"
                                                    className="form-input w-auto text-sm py-1"
                                                    value={draftStartDate}
                                                    onChange={e => setDraftStartDate(e.target.value)}
                                                />
                                                <span className="text-[var(--text-disabled)]">→</span>
                                                <input
                                                    type="date"
                                                    className="form-input w-auto text-sm py-1"
                                                    value={draftEndDate}
                                                    onChange={e => setDraftEndDate(e.target.value)}
                                                />
                                                <button
                                                    onClick={fetchDrafts}
                                                    disabled={isFetchingDrafts || isSendingDrafts}
                                                    className="btn btn-primary !py-1"
                                                >
                                                    {isFetchingDrafts
                                                        ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Loading...</>
                                                        : <><i className="fa-solid fa-filter"></i> Filter</>}
                                                </button>
                                            </div>
                                            <p className="text-xs text-[var(--text-disabled)] flex items-center gap-1.5 mt-2">
                                                <i className="fa-solid fa-circle-info"></i>
                                                Filter is based on draft creation date. Results for reply drafts may vary.
                                            </p>
                                        </div>
                                    </div>

                                    {drafts.length === 0 && !isFetchingDrafts && (
                                        <div className="app-card text-center text-[var(--text-secondary)] text-sm py-8">
                                            <i className="fa-solid fa-inbox text-2xl mb-3 block text-[var(--text-disabled)]"></i>
                                            No drafts found in this date range. Try widening the filter.
                                        </div>
                                    )}

                                    {drafts.length > 0 && (
                                        <div className="flex flex-col gap-2 shrink-0">
                                            <div className="flex items-center gap-3 px-1 mb-2">
                                                <input
                                                    type="checkbox"
                                                    className="accent-[var(--brand-primary)] w-4 h-4 cursor-pointer"
                                                    checked={selectedDraftIds.size === drafts.length && drafts.length > 0}
                                                    onChange={toggleAllDrafts}
                                                />
                                                <span className="text-sm text-[var(--text-secondary)]">
                                                    {selectedDraftIds.size} of {drafts.length} draft{drafts.length === 1 ? '' : 's'} selected
                                                </span>
                                                <button
                                                    onClick={handleSendDrafts}
                                                    disabled={selectedDraftIds.size === 0 || isSendingDrafts}
                                                    className="btn btn-primary ml-auto"
                                                >
                                                    {isSendingDrafts
                                                        ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Sending...</>
                                                        : <><i className="fa-solid fa-paper-plane"></i> Send {selectedDraftIds.size} Draft{selectedDraftIds.size === 1 ? '' : 's'}</>}
                                                </button>
                                            </div>

                                            {drafts.map(draft => {
                                                const isExpanded = expandedDraftId === draft.id;
                                                const isSelected = selectedDraftIds.has(draft.id);
                                                return (
                                                    <div
                                                        key={draft.id}
                                                        className={`app-card p-0 overflow-hidden transition-all ${isSelected ? 'border-[var(--brand-primary)]/30' : 'opacity-60'}`}
                                                    >
                                                        <div className="flex items-center gap-3 p-4">
                                                            <input
                                                                type="checkbox"
                                                                className="accent-[var(--brand-primary)] w-4 h-4 cursor-pointer shrink-0"
                                                                checked={isSelected}
                                                                onChange={() => toggleDraftSelection(draft.id)}
                                                                onClick={e => e.stopPropagation()}
                                                            />
                                                            <div
                                                                className="flex-grow min-w-0 cursor-pointer"
                                                                onClick={() => handleExpandDraft(draft.id)}
                                                            >
                                                                <div className="text-sm font-semibold text-white truncate">{draft.subject}</div>
                                                                <div className="text-xs text-[var(--text-secondary)] mt-0.5 truncate">
                                                                    To: {draft.to}
                                                                    {draft.cc ? ` · CC: ${draft.cc}` : ''}
                                                                    {' · '}From: {draft.from}
                                                                    {' · '}{new Date(draft.createdAt).toLocaleDateString()}
                                                                </div>
                                                            </div>
                                                            <button
                                                                onClick={() => handleExpandDraft(draft.id)}
                                                                className="text-[var(--text-disabled)] hover:text-white transition-colors shrink-0 px-1"
                                                                aria-label={isExpanded ? 'Collapse' : 'Expand'}
                                                            >
                                                                <i className={`fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-sm`}></i>
                                                            </button>
                                                        </div>

                                                        {isExpanded && (
                                                            <div className="mx-4 mb-4 rounded overflow-hidden border border-[var(--border-moderate)]">
                                                                <div className="bg-[var(--surface-primary)] px-3 py-1.5 text-xs text-[var(--text-secondary)] flex items-center gap-2">
                                                                    <i className="fa-solid fa-envelope text-[var(--brand-primary)]"></i> Email Preview
                                                                </div>
                                                                {draftContentCache[draft.id] ? (
                                                                    <iframe
                                                                        srcDoc={draftContentCache[draft.id]}
                                                                        sandbox="allow-same-origin"
                                                                        className="preview-pane-iframe"
                                                                        style={{ height: '300px', width: '100%', border: 'none', background: '#fff' }}
                                                                        title={`Preview: ${draft.subject}`}
                                                                    />
                                                                ) : (
                                                                    <div className="bg-white h-32 flex items-center justify-center text-gray-400">
                                                                        <i className="fa-solid fa-circle-notch fa-spin text-[var(--brand-primary)] text-xl"></i>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}

                                            {draftsNextPageToken && (
                                                <div className="flex justify-center shrink-0">
                                                    <button
                                                        onClick={loadMoreDrafts}
                                                        disabled={isLoadingMoreDrafts || isSendingDrafts}
                                                        className="btn btn-secondary"
                                                    >
                                                        {isLoadingMoreDrafts
                                                            ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Loading...</>
                                                            : <><i className="fa-solid fa-chevron-down"></i> Load More Drafts</>}
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                            {draftSendResults && (
                                <div className="w-full md:w-80 bg-black/20 border-l border-[var(--border-moderate)] p-6 flex flex-col shadow-inner shrink-0">
                                    <h3 className="text-sm font-bold text-[var(--text-secondary)] uppercase tracking-[0.05em] flex items-center gap-2 m-0 mb-6">
                                        <i className="fa-solid fa-list-check"></i> Send Results
                                    </h3>
                                    <div className="flex flex-col gap-2 flex-grow overflow-y-auto custom-scrollbar">
                                        {draftSendResults.map(r => (
                                            <div key={r.draftId} className="text-sm flex items-start gap-2">
                                                <i className={`fa-solid ${r.success ? 'fa-circle-check text-[var(--status-success)]' : 'fa-circle-xmark text-[var(--status-critical)]'} mt-0.5 shrink-0`}></i>
                                                <div className="min-w-0">
                                                    <div className={`font-semibold truncate ${r.success ? 'text-[var(--status-success)]' : 'text-[var(--status-critical)]'}`}>{r.subject}</div>
                                                    {!r.success && r.error && (
                                                        <div className="text-xs text-[var(--text-disabled)] mt-0.5">{r.error}</div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-auto pt-4 border-t border-[var(--border-moderate)] text-xs text-[var(--text-disabled)]">
                                        {draftSendResults.filter(r => r.success).length} sent
                                        {' · '}
                                        {draftSendResults.filter(r => !r.success).length} failed
                                        {' · '}
                                        {new Date().toLocaleDateString()}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </main>

            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AirPostApp />);
</script>

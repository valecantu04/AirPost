<script>
//global variables to track sheet validation status
let isSheetValidated = false;
let currentSheetId = ''; // To store the last validated sheet ID
let currentTabName = ''; // To store the last validated tab name
let currentTemplateId = ''; // To store the last selected template ID

document.addEventListener("DOMContentLoaded", initializeUI);

async function initializeUI() {
    showLoading(true);
    try {
        // Fetch all initial data concurrently
        await Promise.all([
            fetchUserEmail(),
            fetchTemplateFolderId(), // This also implicitly updates folderLink href
            fetchTemplateFolderName(),
            loadTemplates(),
            //fetchSubjectLine(),
            fetchSendAsAliases(),
            fetchAndDisplayEmailCount()
        ]);
    } catch (error) {
        handleError(error, "Failed to load UI data.");
    } finally { // Ensure loading is hidden even if there's an error during initialization
        showLoading(false);
    }
}

function showToast(message, type = "success") {
    let toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="${type === 'success' ? 'fa fa-check-circle' : 'fa fa-exclamation-triangle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add("fade"), 100);
    setTimeout(() => toast.remove(), 4000);
}

function extractId(link) {
    let match = link.match(/[-\w]{25,}/);
    return match ? match[0] : null;
}

function fetchUserEmail() {
    google.script.run.withSuccessHandler(displayUserEmail).getUserEmail();
}

function displayUserEmail(email) {
    document.getElementById("userEmailDisplay").textContent = `Logged in as: ${email}`;
}

function fetchSendAsAliases() {
    google.script.run
        .withSuccessHandler(aliases => {
            const sendAsSelect = document.getElementById("sendAsSelect");
            sendAsSelect.innerHTML = ""; // Clear existing options

            if (!aliases || aliases.length === 0) {
                const option = document.createElement("option");
                option.value = "";
                option.textContent = "No 'Send As' addresses found.";
                sendAsSelect.appendChild(option);
                // Optionally disable sending if no addresses are found
                // document.getElementById("sendEmailsButton").disabled = true;
                return;
            }

            aliases.forEach(alias => {
                const option = document.createElement("option");
                option.value = alias.email;
                option.textContent = alias.displayName || alias.email;
                option.dataset.displayName = alias.displayName || alias.email;
                if (alias.isPrimary) {
                    option.selected = true; // Select the primary email by default
                }
                sendAsSelect.appendChild(option);
            });
            // Ensure a default is selected if no primary was found or if aliases.length > 0
            if (sendAsSelect.selectedIndex === -1 && aliases.length > 0) {
                sendAsSelect.selectedIndex = 0;
            }
        })
        .withFailureHandler(error => {
            handleError(error, "Failed to load 'Send As' email addresses.");
            document.getElementById("sendAsSelect").innerHTML = "<option value=''>Error loading addresses</option>";
        })
        .getSendAsAliases(); // Call the new server-side function
}

function loadTemplates() {
    showLoading(true); // Ensure loading is shown for this specific operation
    google.script.run
        .withSuccessHandler(templates => {
            if (!templates || !Array.isArray(templates)) {
                handleError("Invalid response from server", "Failed to load templates.");
                return;
            }
            displayTemplates(templates);
            // After loading templates, update currentTemplateId
            currentTemplateId = document.getElementById("templateSelect").value;
            // Add event listener for template selection change
            document.getElementById("templateSelect").addEventListener('change', () => {
                currentTemplateId = document.getElementById("templateSelect").value;
                // Reset validation status if template changes
                isSheetValidated = false;
                resetValidationDisplay();
                document.getElementById("emailPreview").innerHTML = "";
            });
            showLoading(false); // Hide loading on success
        })
        .withFailureHandler(error => {
            handleError(error, "Failed to load templates.");
            showLoading(false); // Hide loading on failure
        })
        .getTemplates();
}

function displayTemplates(templates) {
    let dropdown = document.getElementById("templateSelect");
    dropdown.innerHTML = "";
    if (!templates || templates.length === 0) {
        let option = document.createElement("option");
        option.value = "";
        option.textContent = "No templates available";
        dropdown.appendChild(option);
        return;
    }
    templates.forEach(template => {
        let option = document.createElement("option");
        option.value = template.id;
        option.textContent = template.name;
        dropdown.appendChild(option);
    });
}

function updateTemplateSource() {
    let link = document.getElementById("templateSource").value.trim();
    let newFolderId = extractId(link);

    const validationMessage = document.getElementById("templateValidationMessage");
    const validationBanner = document.getElementById("templateValidate");

    if (!newFolderId || !/^[a-zA-Z0-9_-]+$/.test(newFolderId)) { // Client-side validation added here
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Invalid folder ID.`;
        showToast("Template source update failed", "error");
        // No need to call handleError or showLoading(false) again as it's not a server error
        return;
    }
    showLoading(true);
    google.script.run
        .withSuccessHandler(() => {
            validationBanner.className = "alert good";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-check' style='color:var(--status-baseSuccess)'></i> Template source folder has been updated.`;
            showToast("Template source updated!");
            loadTemplates(); // Reload templates after folder change
            fetchTemplateFolderName(); // Update displayed folder name
            fetchTemplateFolderId(); // Update the folder link href
            showLoading(false);
            // Reset sheet validation status as template source changed
            isSheetValidated = false;
            resetValidationDisplay();
        })
        .withFailureHandler(error => {
            validationBanner.className = "alert bad";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Failed to update template source: ${error.message}`; // Display server error message
            showToast("Template source update failed", "error");
            handleError(error, "Failed to update template source.");
            showLoading(false);
        })
        .setTemplateFolderId(newFolderId);
}

function fetchTemplateFolderName() {
    google.script.run
        .withSuccessHandler(folderName => {
            document.getElementById("templateFolderName").textContent = folderName;
        })
        .withFailureHandler(() => {
            document.getElementById("templateFolderName").textContent = "⚠️ Failed to load folder name";
        })
        .getTemplateFolderName();
}

function fetchTemplateFolderId() {
    google.script.run
        .withSuccessHandler(folderId => {
            let newLink = "https://drive.google.com/drive/folders/" + folderId;
            document.getElementById("folderLink").href = newLink;
        })
        .withFailureHandler(() => {
            let newLink = "https://drive.google.com/drive/folders/#"; // Fallback to a non-functional link
            document.getElementById("folderLink").href = newLink;
        })
        .getTemplateFolderId();
}

function fetchAndPopulateTabs(sheetId) {
    const tabSelect = document.getElementById("tabSelect");
    const previouslySelected = tabSelect.value;

    return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(tabNames => {
            tabSelect.innerHTML = "";
            if (tabNames.length === 0) {
                const option = document.createElement("option");
                option.value = "";
                option.textContent = "No tabs found";
                tabSelect.appendChild(option);
            } else {
                tabNames.forEach(name => {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    tabSelect.appendChild(option);
                });

                if (tabNames.includes(previouslySelected)) {
                    tabSelect.value = previouslySelected;
                } else if (tabNames.length > 0) {
                    tabSelect.value = tabNames[0];
                }
            }
            // Add event listener for tab selection change
            tabSelect.addEventListener('change', () => {
                currentTabName = tabSelect.value;
                // Reset validation status if tab changes
                isSheetValidated = false;
                resetValidationDisplay();
                document.getElementById("emailPreview").innerHTML = "";
            });
            resolve();
        }).withFailureHandler(error => {
            reject(error);
        }).getSheetTabs(sheetId);
    });
}

async function validateSheet() {
    const templateId = document.getElementById("templateSelect").value;
    const sheetLinkInput = document.getElementById("sheetId"); // Get the input element
    const link = sheetLinkInput.value.trim();
    const sheetId = extractId(link);

    // Update global sheet ID and template ID for consistent checks
    currentSheetId = sheetId;
    currentTemplateId = templateId;

    const validationMessage = document.getElementById("validationMessage");
    const validationBanner = document.getElementById("sheetValidate");
    validationBanner.className = "alert"; // Reset alert state
    resetValidationDisplay(); // Clear previous validation details

    if (!templateId) { // Check template first
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please select a template.`;
        showToast("Validation failed: Select template", "error");
        isSheetValidated = false; // Important: Set validation to false
        return;
    }

    if (!sheetId || !/^[a-zA-Z0-9_-]+$/.test(sheetId)) { // Client-side validation for sheet ID
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Invalid Google Sheet link/ID.`;
        showToast("Validation failed: Invalid Sheet ID", "error");
        isSheetValidated = false; // Important: Set validation to false
        return;
    }

    showLoading(true);
    try {
        await fetchAndPopulateTabs(sheetId); // This call can reject if sheetId is bad
        currentTabName = document.getElementById("tabSelect").value; // Set currentTabName after populating
    } catch (error) {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Failed to load sheet tabs: ${error.message}`;
        showToast("Failed to load sheet tabs", "error");
        handleError(error, "Failed to load sheet tabs.");
        showLoading(false);
        isSheetValidated = false; // Important: Set validation to false
        return;
    }

    const tabName = document.getElementById("tabSelect").value;
    if (!tabName) { // Check if a tab was successfully populated/selected
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> No sheet tab selected or found.`;
        showToast("Validation failed: No tab selected", "error");
        showLoading(false);
        isSheetValidated = false; // Important: Set validation to false
        return;
    }

    google.script.run
        .withSuccessHandler(displayValidationDetails)
        .withFailureHandler(error => {
            validationBanner.className = "alert bad";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Error validating sheet: ${error.message}`;
            showToast("Sheet validation failed", "error");
            handleError(error, "Failed to validate sheet columns.");
            showLoading(false);
            isSheetValidated = false; // Important: Set validation to false
        })
        .validateSheetColumns(sheetId, templateId, tabName);
}

function displayValidationDetails(result) {
    showLoading(false);
    const validationMessage = document.getElementById("validationMessage");
    const templateHeadersRow = document.getElementById("templateHeadersRow");
    const sheetHeadersRow = document.getElementById("sheetHeadersRow");
    const validationBanner = document.getElementById("sheetValidate");

    if (result.valid) {
        validationBanner.className = "alert good";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-check' style='color:var(--status-baseSuccess)'></i> Sheet is valid. You can now send emails.`;
        showToast("Sheet is valid!", "success");
        isSheetValidated = true; // Set validation to true on success
    } else {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Missing columns: ${result.missingKeywords.join(", ")}.`;
        showToast("Sheet validation failed", "error");
        isSheetValidated = false; // Set validation to false on failure
    }

    templateHeadersRow.innerHTML = "";
    sheetHeadersRow.innerHTML = "";

    result.templateHeaders.forEach(header => {
        const div = document.createElement("div");
        if (result.missingKeywords.includes(header)) { // Use .includes for better readability
            div.className = "grid-item miss";
        } else if (result.sheetHeaders.includes(header)) {
            div.className = "grid-item match";
        } else {
            div.className = "grid-item"; // Fallback for headers not in sheet but also not explicitly missing
        }
        div.textContent = header;
        templateHeadersRow.appendChild(div);
    });

    result.sheetHeaders.forEach(header => {
        const div = document.createElement("div");
        if (result.templateHeaders.includes(header)) {
            div.className = "grid-item match";
        } else {
            div.className = "grid-item";
        }
        div.textContent = header;
        sheetHeadersRow.appendChild(div);
    });
}

// New function to reset validation display
function resetValidationDisplay() {
    const validationMessage = document.getElementById("validationMessage");
    const subjectValidationMessage = document.getElementById("subjectValidationMessage");
    const templateHeadersRow = document.getElementById("templateHeadersRow");
    const sheetHeadersRow = document.getElementById("sheetHeadersRow");
    const sheetValidationBanner = document.getElementById("sheetValidate");
    const previewValidationBanner = document.getElementById("subjectValidate");

    sheetValidationBanner.className = "alert";
    previewValidationBanner.className = "alert";
    validationMessage.innerHTML = "";    
    subjectValidationMessage.innerHTML = "";
    templateHeadersRow.innerHTML = "";
    sheetHeadersRow.innerHTML = "";
}


function previewEmail() {
    const templateId = document.getElementById("templateSelect").value;
    const sheetLinkInput = document.getElementById("sheetId");
    const sheetId = extractId(sheetLinkInput.value.trim());
    const tabName = document.getElementById("tabSelect").value;
    const subjectLineInput = document.getElementById("emailSubject"); // Get the input for subject
    let currentSubjectLine = subjectLineInput.value.trim(); // Get the subject from the input field

    const validationMessage = document.getElementById("subjectValidationMessage");
    const validationBanner = document.getElementById("subjectValidate");
    validationBanner.className = "alert"; // Reset alert state

    // --- IMPORTANT: Add validation checks here ---
    if (!isSheetValidated || currentSheetId !== sheetId || currentTabName !== tabName || currentTemplateId !== templateId) {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please validate your sheet and template first.`;
        showToast("Preview generation failed: Sheet not validated or selection changed.", "error");
        return;
    }
    // --- End important validation checks ---

    if (!currentSubjectLine) { // Check if subject line is empty for preview
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please enter a subject line for the preview.`;
        showToast("Preview generation failed: Empty Subject", "error");
        return;
    }

    showLoading(true);
    google.script.run
        .withSuccessHandler(emailContent => {
            displayPreview(emailContent);
            showLoading(false); // Hide loading after both content and subject are set            
        })
        .withFailureHandler(error => {
            handleError(error, "Failed to generate email preview.");
            showLoading(false);
        })
        .generateEmailPreview(sheetId, templateId, tabName);
}

function displayPreview(emailContent) {
    const previewContainer = document.getElementById("previewContainer");
    const emailPreview = document.getElementById("emailPreview");
    const validationMessage = document.getElementById("subjectValidationMessage");
    const validationBanner = document.getElementById("subjectValidate");

    if (!emailContent || emailContent === "Error generating preview.") {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Failed to generate preview. Please check your template or sheet data.`;
        showToast("Preview generation failed", "error");
    } else {
        validationBanner.className = "alert good";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-check' style='color:var(--status-baseSuccess)'></i> Email preview has been generated!`;
        showToast("Email preview has been generated!", "success");
        emailPreview.innerHTML = emailContent;
    }
}

function fetchSubjectLine() {
    google.script.run
        .withSuccessHandler(subjectLine => {
            document.getElementById("emailSubject").value = subjectLine;
            document.getElementById("subjectLine").textContent = subjectLine;
        })
        .withFailureHandler(() => {
            document.getElementById("subjectLine").textContent = "⚠️ Failed to get subject line";
        })
        .getSubjectLine();
}

function updateSubject() {
    let subjectLine = document.getElementById("emailSubject").value.trim(); // Trim whitespace
    const validationMessage = document.getElementById("subjectValidationMessage");
    const validationBanner = document.getElementById("subjectValidate");
    validationBanner.className = "alert"; // Reset alert state

    if (!subjectLine) {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Subject line cannot be empty.`;
        showToast("Empty subject line", "error");
        return;
    }

    showLoading(true);
    google.script.run
        .withSuccessHandler(() => {
            validationBanner.className = "alert good";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-check' style='color:var(--status-baseSuccess)'></i> Subject line updated!`;
            showToast("Subject line updated!");
            fetchSubjectLine(); // Refresh the displayed subject line and input value
            showLoading(false);
        })
        .withFailureHandler(error => {
            validationBanner.className = "alert bad";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Failed to update subject line: ${error.message}`;
            showToast("Subject line update failed", "error");
            handleError(error, "Failed to update subject line.");
            showLoading(false);
        })
        .setSubjectLine(subjectLine);
}

function confirmSendEmails() {
    const templateId = document.getElementById("templateSelect").value;
    const sheetLinkInput = document.getElementById("sheetId");
    const sheetId = extractId(sheetLinkInput.value.trim());
    const tabName = document.getElementById("tabSelect").value;
    const emailSubjectInput = document.getElementById("emailSubject"); // Get from the input field
    const subjectLine = emailSubjectInput.value.trim(); // Get the actual value for sending
    
    const sendAsSelect = document.getElementById("sendAsSelect"); // Get the select element
    const selectedOption = sendAsSelect.options[sendAsSelect.selectedIndex]; // Get the selected option
    const selectedFromEmail = selectedOption ? selectedOption.value : ''; // Get the email value
    const selectedFromName = selectedOption ? selectedOption.dataset.displayName : ''; // Get the display name from data-attribute

    const validationMessage = document.getElementById("subjectValidationMessage");
    const validationBanner = document.getElementById("subjectValidate");
    validationBanner.className = "alert"; // Reset alert state


    if (!isSheetValidated || currentSheetId !== sheetId || currentTabName !== tabName || currentTemplateId !== templateId) {
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please validate your sheet and template first before sending emails.`;
        showToast("Cannot send: Sheet not validated or selection changed.", "error");
        return;
    }

    if (!subjectLine) { // Use the value from the input field
        validationBanner.className = "alert bad";
        validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please enter a subject line.`;
        showToast("Cannot send: No subject line.", "error");
        return;
    }

    if (!selectedFromEmail) {
        const sendAsValidationMessage = document.getElementById("sendAsValidationMessage");
        const sendAsValidationBanner = document.getElementById("sendAsValidate");
        sendAsValidationBanner.className = "alert bad";
        sendAsValidationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Please select a 'Send As' email address.`;
        showToast("Cannot send: No 'From' address selected.", "error");
        return;
    }

    if (confirm("Are you sure you want to send emails? This action cannot be undone.")) {
        sendEmails(sheetId, templateId, subjectLine, tabName, selectedFromEmail, selectedFromName); // Pass selectedFromEmail
    }
}

function sendEmails(sheetId, templateId, subject, tabName, fromEmail, fromName) { // Receive values as parameters
    showLoading(true);

    google.script.run
        .withSuccessHandler(result => {
            showSendResult(result);
        })
        .withFailureHandler(error => {
            const validationMessage = document.getElementById("subjectValidationMessage"); // Ensure these are defined for the failure case
            const validationBanner = document.getElementById("subjectValidate");

            validationBanner.className = "alert bad";
            validationMessage.innerHTML = `<i class='fa-solid fa-circle-xmark' style='color:var(--status-baseCritical)'></i> Failed to send Emails: ${error.message}`;
            showToast("Failed to send Emails.", "error");
            handleError(error, "Failed to send Emails.");
            showLoading(false);
        })
        .sendEmailsWithSheet(sheetId, templateId, subject, tabName, fromEmail, fromName);
}

function showSendResult(result) {
    showLoading(false);
    const sendMessage = document.getElementById("sendMessage");
    sendMessage.innerHTML = `
        <div><i class="fa-solid fa-paper-plane"></i> Sent: ${result.details.sent} | <i class="fa-solid fa-forward"></i> Skipped (Already Sent): ${result.details.skipped} | <i class="fa-solid fa-triangle-exclamation"></i> Failed: ${result.details.failed.length}</div>
    `;

    if (result.details.failed.length > 0) {
        let errorList = "<ul class='failed-emails-list'>"; // Add a class for styling
        result.details.failed.forEach(error => {
            errorList += `<li>${error.email} - ${error.error}</li>`;
        });
        errorList += "</ul>";
        sendMessage.innerHTML += errorList;
        sendMessage.className = "alert bad"; // Highlight send message if failures
    } else {
        sendMessage.className = "alert good"; // Highlight success if no failures
    }

    showToast(result.message, result.success ? "success" : "error");
    fetchAndDisplayEmailCount();
    // Only cleanup UI and reset properties if all emails were attempted to send (even if some failed)
    // and if the overall operation was considered a "success" (i.e., script didn't crash)
    if (result.success) { // This means the Apps Script function finished without throwing an uncaught error
        cleanupUi(); // This will also call the server-side cleanup
        // Reset validation status after send operation
        isSheetValidated = false;
        resetValidationDisplay();
    }
}

function showLoading(state) {
    document.getElementById("loadingIndicator").style.display = state ? "flex" : "none"; // Change to flex for lottie-player
}

function cleanupUi() {
    // Clear the visual state of the UI elements related to validation and preview
    const alertElements = document.querySelectorAll(".alert");
    const alertTextElements = document.querySelectorAll(".alertText");

    alertElements.forEach(alert => {
        alert.className = "alert"; // Reset to base class
    });

    alertTextElements.forEach(alertText => {
        alertText.innerHTML = "";
    });

    // Clear email preview and subject preview
    document.getElementById("emailPreview").innerHTML = "";

    // Reset subject line input if desired after send
    document.getElementById("emailSubject").value = "";

    // Reset sheet and template selection in UI for a fresh start
    document.getElementById("sheetId").value = "";
    loadTemplates();
    //document.getElementById("tabSelect").innerHTML = '<option value="Select Sheet Tab">Validate Sheet to Select Tab</option>'; // Reset tab dropdown
    //document.getElementById("templateSelect").value = ""; // Reset template dropdown to default/first option if available

    // Reset internal state variables
    isSheetValidated = false;
    currentSheetId = '';
    currentTabName = '';
    currentTemplateId = '';

    // Call the server-side function to delete the stored property
    google.script.run.cleanup();
}

function handleError(error, message = "An error occurred.") {
    console.error(error);
    document.getElementById("errorMessage").innerText = message; // Make sure you have an element with this ID.
    showToast(message, "error"); // Show a toast for the error
}

// Function to format name (kept for client-side usage in previewEmail)
function formatName(name) {
    return name ? name.split(' ')[0].charAt(0).toUpperCase() + name.split(' ')[0].slice(1).toLowerCase() : '';
}

function fetchAndDisplayEmailCount() {
    google.script.run
        .withSuccessHandler(count => {
            document.getElementById("totalSentCount").textContent = count.toLocaleString(); // Format with commas
        })
        .withFailureHandler(error => {
            Logger.log("Failed to fetch total sent email count: " + error.message);
            document.getElementById("totalSentCount").textContent = "Error";
        })
        .getTotalSentEmailCount(); // Call the new server-side function
}
</script>

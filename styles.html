<style>
    /* --- AIRFOIL DESIGN TOKENS --- */
    :root {
        --font-sans: 'Inter', sans-serif;
        
        /* Brand Colors */
        --brand-primary: #22d3ee; 
        --brand-primary-hover: rgb(9, 168, 184); 
        
        /* Text Colors */
        --text-primary: rgb(255, 255, 255);
        --text-secondary: rgba(255, 255, 255, 0.8);
        --text-disabled: rgba(255, 255, 255, 0.56);
        
        /* Background Colors */
        --background-gradient: fixed radial-gradient(circle at 0% 0%, rgba(4,25,60,1), rgba(8,29,63,0) 95%),fixed radial-gradient(circle at 90% 15%, rgba(40,23,144,.6), rgba(37,30,125,0) 38%),fixed radial-gradient(circle at 40% 59%, rgba(0,79,173,1), rgba(0,73,159,0) 60%),fixed radial-gradient(circle at 100% 100%, rgba(0,134,168,.68), rgba(14,86,117,.09) 64%),fixed radial-gradient(circle at 30% 100%, rgba(2,88,144,1), rgba(2,88,144,.1) 30%),fixed radial-gradient(circle at 99% 99%, rgba(0,48,83,1), rgba(0,48,83,1) 60%) beige;
        --surface-primary: rgb(9, 53, 101);
        --card-background: linear-gradient(135deg, rgba(47, 202, 255, 0.06) 0%, rgba(29, 161, 220, 0.06) 100%);
        --modal-background: rgba(10, 46, 87, 0.95);
        --secondary-hover: rgba(47, 202, 255, 0.24);

        /* Input Colors */
        --input-background: rgba(105, 224, 255, 0.08);
        --input-border: rgb(77, 210, 210);
        --input-border-hover: rgb(149, 238, 229);
        
        /* Border Colors */
        --border-moderate: rgba(255, 255, 255, 0.24);
        --border-weak: rgba(9, 168, 184, 0.24);
        
        /* Status Colors */
        --status-success: rgb(33, 221, 170);
        --status-critical: rgb(255, 86, 100);
        
        --border-radius: 6px;
    }

    body {
        font-family: var(--font-sans);
        background: var(--background-gradient);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
    }

    /* --- AIRFOIL COMPONENTS --- */
    .btn {
        padding: 0.5rem 1rem;
        border-radius: var(--border-radius);
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .btn-primary {
        background-color: var(--brand-primary);
        color: #020f24;
        border-color: var(--brand-primary);
    }
    
    .btn-primary:hover:not(:disabled) {
        background-color: var(--brand-primary-hover);
        border-color: var(--brand-primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
    }
    
    .btn:disabled {
        background-color: rgba(255, 255, 255, 0.1);
        color: var(--text-disabled);
        border-color: var(--border-moderate);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
    
    .btn-secondary {
        background-color: transparent;
        color: var(--brand-primary);
        border-color: var(--border-moderate);
    }
    
    .btn-secondary:hover:not(:disabled) {
        background-color: var(--secondary-hover);
        border-color: var(--brand-primary);
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--input-border);
        background-color: var(--input-background);
        border-radius: var(--border-radius);
        font-size: 0.95rem;
        color: var(--text-primary);
        font-family: var(--font-sans);
        transition: all 0.2s ease;
    }
    
    .form-input:hover:not(:disabled) {
        border-color: var(--input-border-hover);
    }
    
    .form-input:focus {
        outline: none;
        border-color: var(--brand-primary-hover);
        box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
        background-color: rgba(105, 224, 255, 0.12);
    }

    .form-input option {
        background-color: var(--surface-primary);
        color: var(--text-primary);
    }

    .wizard-layout {
        background: var(--modal-background);
        border: 1px solid var(--border-weak);
        box-shadow: 14px 14px 22px 0 rgba(0, 0, 0, 0.10), 3px 4px 6px 0 rgba(0, 0, 0, 0.10);
        border-radius: 12px;
        backdrop-filter: blur(16px);
    }

    .app-card {
        background: var(--card-background);
        border: 1px solid var(--border-moderate);
        border-radius: var(--border-radius);
        padding: 1.5rem;
    }

    /* --- CUSTOM SCROLLBAR --- */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-moderate); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

    /* --- SUMMARY SIDEBAR ITEM STYLES --- */
    .summary-item {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--border-moderate);
    }
    .summary-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }
    .summary-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        font-weight: 600;
    }
    .summary-value {
        font-size: 0.95rem;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .summary-value.pending {
        color: rgba(255, 255, 255, 0.7); 
        font-style: italic;
        font-weight: 400;
    }

    /* Toast Animation */
    @keyframes slideInRight { 
        from { transform: translateX(120%); opacity: 0; } 
        to { transform: translateX(0); opacity: 1; } 
    }
    
    /* NEW: Pure fade out for a clean exit */
    @keyframes fadeOutToast { 
        from { opacity: 1; transform: translateX(0); } 
        to { opacity: 0; transform: translateX(0); } 
    }
    
    .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    /* Apply the new fadeOut animation */
    .toast-exit { animation: fadeOutToast 0.4s ease-out forwards; }

    /* --- LOGO --- */
  .header-logo-group {
    display: flex;
    align-items: center;
    justify-content: flex-end; /* Push to far right */
    gap: 12px;
    padding-right: 1rem;
  }

  .header-logo {
    height: 36px;
    flex-shrink: 0;
  }
  
  .header-logo svg {
      height: 100%;
      width: auto;
  }

  .header-powered-by {
    font-size: 0.875rem; /* from Header.jsx */
    color: var(--text-secondary);
    white-space: nowrap;
  }


</style>

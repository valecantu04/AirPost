        rgba(0,48,83,1),
        rgba(0,48,83,1) 60%) beige;
      color: var(--text-strong);
      margin: 0;
      padding: 20px;
    }
    .container {
      position: relative;
      max-width: 70rem;
      margin: auto;
      background: fixed radial-gradient(circle at 0% 0%,
        rgba(4,25,60,1),
        rgba(8,29,63,0) 95%),fixed radial-gradient(circle at 90% 15%,
        rgba(40,23,144,.6),

        rgba(2,88,144,1),
        rgba(2,88,144,.1) 30%),fixed radial-gradient(circle at 99% 99%,
        rgba(0,48,83,1),
        rgba(0,48,83,1) 60%) beige;
      padding: 0px 20px 20px;
      border-radius: 4px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);

    }
    input {
      border: 0px;
      width: 13.143rem;
      text-align: left;
      padding: 0.714rem 0.571rem 0.643rem;
      line-height: 1.429rem;
      font-family: inherit;
      outline: 0px;
      min-width: 21.429rem;
      -webkit-box-flex: 1;
      flex-grow: 1;
      height: inherit;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      background: var(--input-backgroundDefault);
      border-bottom-width: 1px;
      border-bottom-style: solid;
      border-color: var(--input-borderDefault);
      box-shadow: rgba(0, 0, 0, 0.08) 0px 0px 2px 1px, rgba(0, 0, 0, 0.16) 1px 1px 2px;
      border-radius: 4px;
      color: var(--text-strong);
      font-size: 1rem;
      padding-left: 1.143rem;
      padding-right: 0px;      
    }
    input::placeholder {
      color: var(--text-moderate);
    }
